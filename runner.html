<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0c1424">
<title>돌격! 게이트 러너</title>
<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; overflow:hidden; background:#0a1120; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji",sans-serif;
    color:#fff; display:flex; align-items:center; justify-content:center; touch-action:none;
  }
  #frame{
    position:relative; width:100vw; height:100vh; height:100dvh;
    max-width:520px; margin:0 auto; overflow:hidden; background:#0c1424;
  }
  @supports (height:100dvh){ #frame{ height:100dvh; } }
  #frame.shake{ animation:shake .22s ease; }
  @keyframes shake{ 25%{transform:translate(-3px,2px)} 50%{transform:translate(4px,-2px)} 75%{transform:translate(-2px,-1px)} }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  /* HUD */
  #hud{ position:absolute; left:0; right:0; top:0; padding:max(10px,env(safe-area-inset-top)) 14px 0; pointer-events:none; }
  .hrow{ display:flex; align-items:center; gap:10px; }
  .troops{
    display:flex; align-items:center; gap:6px;
    background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.12);
    padding:6px 12px; border-radius:14px; font-weight:800;
  }
  .troops .ico{ font-size:18px; }
  .troops #count{ font-size:22px; color:#8ff0a4; min-width:34px; text-align:left; }
  .troops #count.flash{ animation:flash .3s ease; }
  @keyframes flash{ 0%{transform:scale(1)} 45%{transform:scale(1.4); color:#fff} 100%{transform:scale(1)} }
  #muteWrap{ margin-left:auto; pointer-events:auto; }
  #mute{
    width:38px; height:38px; border-radius:11px; border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.35); color:#fff; font-size:17px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  #mute:active{ transform:scale(.9); }
  .barouter{ margin-top:9px; height:10px; border-radius:8px; background:rgba(255,255,255,.10); overflow:hidden; position:relative; }
  #prog{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#3ee6a0,#ffd54a,#ff7a59); border-radius:8px; transition:width .12s linear; }
  .flag{ position:absolute; right:2px; top:-4px; font-size:13px; }

  /* Start / End overlays */
  .overlay{
    position:absolute; inset:0; z-index:20; display:none;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:26px;
    background:radial-gradient(120% 100% at 50% 0%, rgba(20,40,80,.92), rgba(6,12,26,.96));
  }
  .overlay.show{ display:flex; animation:fade .35s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .overlay .emo{ font-size:clamp(56px,18vw,96px); }
  .overlay h1{ font-size:clamp(26px,8vw,40px); margin:6px 0; }
  .win h1{ background:linear-gradient(90deg,#ffd54a,#8ff0a4); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lose h1{ color:#ff6b6b; }
  .overlay p{ color:#cfe0ff; font-size:15px; line-height:1.5; max-width:300px; margin:4px 0 4px; }
  .overlay .fake{ opacity:.5; text-decoration:line-through; }
  .overlay .fscore{ margin:8px 0 16px; font-size:17px; }
  .overlay .fscore b{ color:#ffe17a; font-size:26px; }
  .btn{
    border:none; cursor:pointer; font-size:19px; font-weight:800; color:#0a1a12;
    padding:14px 30px; border-radius:15px; margin-top:6px;
    background:linear-gradient(90deg,#8ff0a4,#3ee6a0); box-shadow:0 8px 22px rgba(60,220,150,.4);
    transition:transform .1s;
  }
  .lose .btn{ color:#2a0f0f; background:linear-gradient(90deg,#ffb03c,#ff7a59); box-shadow:0 8px 22px rgba(255,140,80,.4); }
  .btn:active{ transform:scale(.94); }
  .hint{ position:absolute; bottom:max(14px,env(safe-area-inset-bottom)); left:0; right:0; text-align:center; font-size:12px; color:#aab; opacity:.6; pointer-events:none; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="hrow">
      <div class="troops"><span class="ico">🪖</span><span id="count">0</span><span style="opacity:.5;font-size:13px">명</span></div>
      <div id="muteWrap"><button id="mute" aria-label="소리">🔊</button></div>
    </div>
    <div class="barouter"><div id="prog"></div><span class="flag">🏰</span></div>
  </div>
  <div class="hint" id="hint">← 좌우로 끌어서 병력을 움직이세요 →</div>

  <div class="overlay" id="startOv">
    <div class="emo">🪖⚔️</div>
    <h1>돌격! 게이트 러너</h1>
    <p>좌우로 움직여 <b>좋은 게이트</b>로 병력을 불리고<br>적을 쓸어버린 뒤 <b>🏰 성문</b>을 부수세요!</p>
    <button class="btn" id="startBtn">▶ 시작</button>
  </div>

  <div class="overlay win" id="winOv">
    <div class="emo">🏆</div>
    <h1>성문 함락! 승리!</h1>
    <div class="fscore">최종 병력 <b id="winCount">0</b>명</div>
    <p><span class="fake">지금 설치하고 무적 부대 받기!</span><br>…는 농담이고 🔁 한 판 더 하시죠.</p>
    <button class="btn" id="winBtn">🔁 다시하기</button>
  </div>

  <div class="overlay lose" id="loseOv">
    <div class="emo">💀</div>
    <h1>전멸…</h1>
    <p id="loseMsg">병력이 모두 쓰러졌습니다.</p>
    <button class="btn" id="loseBtn">🔁 다시하기</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d");
  var frameEl = document.getElementById("frame");
  var countEl = document.getElementById("count");
  var progEl = document.getElementById("prog");
  var hintEl = document.getElementById("hint");
  var muteBtn = document.getElementById("mute");

  var W=360, H=640, DPR=1;
  function resize(){
    var r = frameEl.getBoundingClientRect();
    W = Math.max(200, r.width); H = Math.max(320, r.height);
    DPR = Math.min(window.devicePixelRatio||1, 2.5);
    cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener("resize", resize);

  // ---- Audio ----
  var audio={ctx:null,muted:false,ok:false};
  function initAudio(){ if(audio.ctx||audio.muted) return; try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; audio.ctx=new AC(); audio.ok=true; }catch(e){ audio.ok=false; } }
  function unlock(){ initAudio(); try{ if(audio.ctx&&audio.ctx.state==="suspended") audio.ctx.resume(); }catch(e){} }
  function tone(freq,dur,type,vol,slideTo){
    if(!audio.ok||audio.muted||!audio.ctx) return;
    try{
      var t=audio.ctx.currentTime, o=audio.ctx.createOscillator(), g=audio.ctx.createGain();
      o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(50,slideTo),t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(audio.ctx.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  var lastShot=0;
  function sfxShot(){ var n=performance.now(); if(n-lastShot<40) return; lastShot=n; tone(680,0.05,"square",0.03,420); }
  function sfxGood(){ tone(440,0.12,"triangle",0.12,880); }
  function sfxBad(){ tone(300,0.2,"sawtooth",0.12,90); }
  function sfxHit(){ tone(180,0.08,"square",0.08,90); }
  function sfxWin(){ [523,659,784,1046,1318].forEach(function(f,i){ setTimeout(function(){ tone(f,0.22,"triangle",0.14,f*1.02); },i*120); }); }
  function sfxLose(){ [400,300,200,120].forEach(function(f,i){ setTimeout(function(){ tone(f,0.25,"sawtooth",0.12,f*0.6); },i*130); }); }
  muteBtn.addEventListener("click", function(){ audio.muted=!audio.muted; muteBtn.textContent=audio.muted?"🔇":"🔊"; if(!audio.muted) unlock(); });

  // ---- Game state ----
  var state="start"; // start, play, win, lose
  var squad, bullets, gates, enemies, boss, effects, floaters;
  var traveled, speed, roadL, roadR, squadY, fireCd, timePrev, running=false;
  var TRACK_END, started=false;

  function roadBounds(){ roadL = W*0.13; roadR = W*0.87; }

  function buildLevel(){
    roadBounds();
    squad = { x:(roadL+roadR)/2, count:6, targetX:(roadL+roadR)/2 };
    bullets=[]; enemies=[]; effects=[]; floaters=[]; gates=[];
    traveled=0; speed=150; fireCd=0; squadY=H*0.80;

    // 게이트 정의: dist(진행거리), 왼쪽/오른쪽 연산
    // op: {t:'mul'|'add'|'sub'|'div', v:number}
    var pairs=[
      { d:520,  L:{t:'add',v:8},  R:{t:'mul',v:2} },
      { d:1150, L:{t:'mul',v:3},  R:{t:'sub',v:5} },
      { d:1850, L:{t:'div',v:2},  R:{t:'add',v:20} },
      { d:2600, L:{t:'mul',v:2},  R:{t:'add',v:12} },
      { d:3350, L:{t:'add',v:15}, R:{t:'mul',v:2} }
    ];
    pairs.forEach(function(p){
      gates.push({ d:p.d, ops:[p.L,p.R], consumed:false });
    });
    // 적 바리케이드: dist, hp
    var barr=[
      { d:850,  hp:14 },
      { d:1500, hp:30 },
      { d:2200, hp:45 },
      { d:3000, hp:70 }
    ];
    barr.forEach(function(b){ enemies.push({ d:b.d, hp:b.hp, maxhp:b.hp, x:(roadL+roadR)/2, w:(roadR-roadL)*0.62, dead:false, contacted:false }); });

    boss = { d:3900, hp:130, maxhp:130, alive:true, arrived:false, drainCd:0 };
    TRACK_END = boss.d;
    updateHud();
  }

  function opText(op){
    var s = op.t==='mul'?'×':op.t==='add'?'+':op.t==='sub'?'−':'÷';
    return s+op.v;
  }
  function applyOp(op){
    var c=squad.count, nc=c;
    if(op.t==='mul') nc=c*op.v;
    else if(op.t==='add') nc=c+op.v;
    else if(op.t==='sub') nc=c-op.v;
    else if(op.t==='div') nc=Math.floor(c/op.v);
    nc=Math.max(0,Math.floor(nc));
    var good = nc>=c;
    squad.count=nc;
    return good;
  }

  // 좌표 변환: 트랙거리 d → 화면 y
  function screenY(d){ return squadY - (d - traveled); }

  function updateHud(){
    countEl.textContent = squad.count;
    countEl.classList.remove("flash"); void countEl.offsetWidth; countEl.classList.add("flash");
    var pct = Math.min(100, traveled/TRACK_END*100);
    progEl.style.width = pct.toFixed(1)+"%";
  }

  function addFloater(x,y,text,color){ floaters.push({x:x,y:y,text:text,color:color,life:0,max:900}); }
  function boom(x,y,color,n){ for(var i=0;i<(n||10);i++){ var a=Math.random()*Math.PI*2,sp=40+Math.random()*120; effects.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:400+Math.random()*300,color:color,r:2+Math.random()*3}); } }
  function shakeIt(){ frameEl.classList.remove("shake"); void frameEl.offsetWidth; frameEl.classList.add("shake"); }

  // ---- Update ----
  function update(dt){
    if(state!=="play") return;

    // 전진 (보스 도착 전까지)
    if(!boss.arrived){
      traveled += speed*dt;
      if(traveled >= boss.d){ traveled=boss.d; boss.arrived=true; }
    }

    // 좌우 이동 (부드럽게 목표 추적)
    squad.x += (squad.targetX - squad.x) * Math.min(1, dt*14);
    squad.x = Math.max(roadL+8, Math.min(roadR-8, squad.x));

    // 진행바
    var pct = Math.min(100, traveled/TRACK_END*100);
    progEl.style.width = pct.toFixed(1)+"%";

    // 사격
    fireCd -= dt;
    if(fireCd<=0 && squad.count>0){
      fireCd = 0.11;
      var nb = Math.max(1, Math.min(7, 1+Math.floor(squad.count/6)));
      var spread = Math.min((roadR-roadL)*0.5, 12+squad.count*0.6);
      for(var i=0;i<nb;i++){
        var off = nb===1?0:(-spread/2 + spread*(i/(nb-1)));
        bullets.push({ x:squad.x+off, y:squadY-16, vy:-620 });
      }
      sfxShot();
      effects.push({x:squad.x,y:squadY-14,vx:0,vy:0,life:0,max:70,color:"#ffe17a",r:6,flash:true});
    }

    // 총알 이동
    for(var b=bullets.length-1;b>=0;b--){
      var bl=bullets[b]; bl.y += bl.vy*dt;
      if(bl.y < -20){ bullets.splice(b,1); }
    }

    // 게이트 통과 판정
    for(var g=0;g<gates.length;g++){
      var gt=gates[g];
      if(!gt.consumed && traveled >= gt.d){
        gt.consumed=true;
        var pickRight = squad.x > (roadL+roadR)/2;
        var op = gt.ops[pickRight?1:0];
        var good = applyOp(op);
        var sy = squadY;
        addFloater(squad.x, sy-30, (good?"":"") + opText(op), good?"#8ff0a4":"#ff6b6b");
        boom(squad.x, sy, good?"#8ff0a4":"#ff6b6b", 14);
        good?sfxGood():sfxBad();
        shakeIt();
        updateHud();
        if(squad.count<=0){ return gameOver("게이트 함정에 병력을 잃었습니다."); }
      }
    }

    // 적 처리
    for(var e=0;e<enemies.length;e++){
      var en=enemies[e];
      if(en.dead) continue;
      var ey = screenY(en.d);
      // 총알 충돌 (적이 화면에 들어와 있을 때)
      if(ey > -60 && ey < H+60){
        for(var bi=bullets.length-1;bi>=0;bi--){
          var bb=bullets[bi];
          if(bb.y <= ey+18 && bb.y >= ey-18 && bb.x > en.x-en.w/2 && bb.x < en.x+en.w/2){
            en.hp -= 1; bullets.splice(bi,1);
            effects.push({x:bb.x,y:ey,vx:0,vy:0,life:0,max:60,color:"#fff",r:3,flash:true});
            if(en.hp<=0){ en.dead=true; boom(en.x,ey,"#ff8c5a",18); sfxHit(); break; }
          }
        }
      }
      // 접촉 판정 (적이 부대 라인 도달)
      if(!en.dead && !en.contacted && traveled >= en.d){
        en.contacted=true; en.dead=true;
        if(en.hp>0){
          var loss=en.hp;
          squad.count=Math.max(0,squad.count-loss);
          addFloater(squad.x, squadY-26, "-"+loss, "#ff6b6b");
          boom(squad.x, squadY, "#ff6b6b", 16); sfxHit(); shakeIt(); updateHud();
          if(squad.count<=0){ return gameOver("바리케이드를 넘지 못했습니다."); }
        }
      }
    }

    // 보스 전투
    if(boss.arrived && boss.alive){
      var by = screenY(boss.d);
      for(var bi2=bullets.length-1;bi2>=0;bi2--){
        var bx=bullets[bi2];
        if(bx.y <= by+40 && bx.x>roadL && bx.x<roadR){
          boss.hp -= 1; bullets.splice(bi2,1);
          effects.push({x:bx.x,y:by+30,vx:0,vy:0,life:0,max:60,color:"#fff",r:3,flash:true});
        }
      }
      if(boss.hp<=0){ boss.alive=false; boom(W/2, by+40, "#ffd54a", 40); return win(); }
      // 보스 반격: 주기적으로 병력 깎기
      boss.drainCd -= dt;
      if(boss.drainCd<=0){
        boss.drainCd=0.7;
        var d=Math.max(2,Math.round(squad.count*0.06)+2);
        squad.count=Math.max(0,squad.count-d);
        addFloater(squad.x, squadY-24, "-"+d, "#ff6b6b");
        updateHud();
        if(squad.count<=0){ return gameOver("성문 앞에서 부대가 무너졌습니다."); }
      }
    }

    // 이펙트/플로터 수명
    for(var ef=effects.length-1;ef>=0;ef--){ var f=effects[ef]; f.life+=dt*1000; f.x+=f.vx*dt; f.y+=f.vy*dt; if(f.life>=f.max) effects.splice(ef,1); }
    for(var fl=floaters.length-1;fl>=0;fl--){ var ft=floaters[fl]; ft.life+=dt*1000; ft.y-=dt*40; if(ft.life>=ft.max) floaters.splice(fl,1); }
  }

  // ---- Render ----
  function drawRoad(){
    ctx.fillStyle="#0c1424"; ctx.fillRect(0,0,W,H);
    // 잔디
    ctx.fillStyle="#12351f"; ctx.fillRect(0,0,W,H);
    // 도로
    ctx.fillStyle="#2a2f3a"; ctx.fillRect(roadL,0,roadR-roadL,H);
    // 도로 가장자리
    ctx.fillStyle="#3a4150"; ctx.fillRect(roadL-4,0,4,H); ctx.fillRect(roadR,0,4,H);
    // 스크롤 차선
    ctx.fillStyle="rgba(255,255,255,.18)";
    var dash=34, gap=28, cx=(roadL+roadR)/2;
    var off=(traveled % (dash+gap));
    for(var y=-off; y<H; y+=dash+gap){ ctx.fillRect(cx-3, y, 6, dash); }
  }
  function drawGates(){
    for(var g=0;g<gates.length;g++){
      var gt=gates[g]; if(gt.consumed) continue;
      var y=screenY(gt.d); if(y<-80||y>H+80) continue;
      var mid=(roadL+roadR)/2;
      var segs=[[roadL,mid,gt.ops[0]],[mid,roadR,gt.ops[1]]];
      for(var s=0;s<2;s++){
        var x0=segs[s][0], x1=segs[s][1], op=segs[s][2];
        var good = op.t==='mul'||op.t==='add';
        ctx.fillStyle = good?"rgba(70,220,150,.28)":"rgba(255,80,80,.30)";
        ctx.fillRect(x0+3, y-34, (x1-x0)-6, 68);
        ctx.strokeStyle = good?"rgba(120,255,190,.9)":"rgba(255,120,120,.9)";
        ctx.lineWidth=2; ctx.strokeRect(x0+3, y-34, (x1-x0)-6, 68);
        ctx.fillStyle="#fff"; ctx.font="800 26px -apple-system,sans-serif";
        ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(opText(op), (x0+x1)/2, y);
      }
    }
  }
  function drawEnemies(){
    for(var e=0;e<enemies.length;e++){
      var en=enemies[e]; if(en.dead) continue;
      var y=screenY(en.d); if(y<-60||y>H+60) continue;
      var w=en.w, h=32;
      ctx.fillStyle="#8a2b2b"; ctx.fillRect(en.x-w/2, y-h/2, w, h);
      ctx.fillStyle="#b83a3a"; ctx.fillRect(en.x-w/2, y-h/2, w, 6);
      // hp bar
      ctx.fillStyle="rgba(0,0,0,.5)"; ctx.fillRect(en.x-w/2, y-h/2-8, w, 5);
      ctx.fillStyle="#ff5555"; ctx.fillRect(en.x-w/2, y-h/2-8, w*Math.max(0,en.hp/en.maxhp), 5);
      ctx.fillStyle="#fff"; ctx.font="800 18px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(en.hp, en.x, y);
    }
  }
  function drawBoss(){
    if(!boss.alive){ return; }
    var y=screenY(boss.d); if(y<-120||y>H+120) return;
    var w=(roadR-roadL)*0.9, h=64, x=(roadL+roadR)/2;
    ctx.font="52px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("🏰", x, y-6);
    // hp bar
    ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(x-w/2, y-h, w, 12);
    ctx.fillStyle="#ff4d4d"; ctx.fillRect(x-w/2, y-h, w*Math.max(0,boss.hp/boss.maxhp), 12);
    ctx.strokeStyle="#fff"; ctx.lineWidth=1.5; ctx.strokeRect(x-w/2, y-h, w, 12);
    ctx.fillStyle="#fff"; ctx.font="800 16px sans-serif"; ctx.fillText("성문 HP "+Math.max(0,boss.hp), x, y-h-12);
  }
  function drawBullets(){
    ctx.fillStyle="#ffe17a";
    for(var b=0;b<bullets.length;b++){ var bl=bullets[b]; ctx.fillRect(bl.x-2, bl.y-8, 4, 12); }
  }
  function drawSquad(){
    var n=Math.max(0,squad.count);
    var shown=Math.min(n,28);
    var spreadW=Math.min((roadR-roadL)*0.55, 26+n*1.0);
    // 배치: 격자형 몰림
    var perRow=Math.max(3, Math.round(Math.sqrt(shown*1.4)));
    for(var i=0;i<shown;i++){
      var row=Math.floor(i/perRow), col=i%perRow;
      var rowN=Math.min(perRow, shown-row*perRow);
      var gx = squad.x + ((col-(rowN-1)/2)/Math.max(1,perRow-1))*spreadW + (Math.sin(i*13.3)*2);
      var gy = squadY + row*11 + 6 - (traveled*0)  ;
      // 살짝 달리는 진동
      var bob = Math.sin((performance.now()/90)+i)*1.5;
      // 몸
      ctx.fillStyle="#3f8f4f"; ctx.beginPath(); ctx.arc(gx, gy+bob, 5.5, 0, Math.PI*2); ctx.fill();
      // 머리
      ctx.fillStyle="#e8c39e"; ctx.beginPath(); ctx.arc(gx, gy-5+bob, 3.1, 0, Math.PI*2); ctx.fill();
      // 총
      ctx.fillStyle="#222"; ctx.fillRect(gx+3, gy-6+bob, 2, 8);
    }
    if(n>shown){
      ctx.fillStyle="#fff"; ctx.font="800 13px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText("+"+(n-shown), squad.x, squadY+38);
    }
  }
  function drawEffects(){
    for(var e=0;e<effects.length;e++){
      var f=effects[e]; var a=1-f.life/f.max;
      ctx.globalAlpha=Math.max(0,a);
      ctx.fillStyle=f.color;
      if(f.flash){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r*(1+ (1-a)),0,Math.PI*2); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha=1;
    for(var fl=0;fl<floaters.length;fl++){
      var ft=floaters[fl]; var a2=1-ft.life/ft.max;
      ctx.globalAlpha=Math.max(0,a2);
      ctx.fillStyle=ft.color; ctx.font="800 22px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(ft.text, ft.x, ft.y);
    }
    ctx.globalAlpha=1;
  }
  function render(){
    drawRoad();
    drawGates();
    drawEnemies();
    drawBoss();
    drawBullets();
    drawSquad();
    drawEffects();
  }

  // ---- Loop ----
  function loop(ts){
    if(!running) return;
    if(!timePrev) timePrev=ts;
    var dt=Math.min(0.05,(ts-timePrev)/1000); timePrev=ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // ---- Flow ----
  function startGame(){
    unlock();
    resize();
    buildLevel();
    state="play"; running=true; timePrev=0;
    document.getElementById("startOv").classList.remove("show");
    document.getElementById("winOv").classList.remove("show");
    document.getElementById("loseOv").classList.remove("show");
    hintEl.style.display="block";
    requestAnimationFrame(loop);
    setTimeout(function(){ hintEl.style.display="none"; }, 3500);
  }
  function win(){
    state="win"; running=false;
    document.getElementById("winCount").textContent=squad.count;
    document.getElementById("winOv").classList.add("show");
    sfxWin();
  }
  function gameOver(msg){
    state="lose"; running=false;
    document.getElementById("loseMsg").textContent=msg||"병력이 모두 쓰러졌습니다.";
    document.getElementById("loseOv").classList.add("show");
    sfxLose();
  }

  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("winBtn").addEventListener("click", startGame);
  document.getElementById("loseBtn").addEventListener("click", startGame);

  // ---- Input ----
  var pressing=false;
  function setTargetFromX(clientX){
    var r=cv.getBoundingClientRect();
    squad.targetX = Math.max(roadL+8, Math.min(roadR-8, clientX - r.left));
  }
  cv.addEventListener("pointerdown", function(e){ if(state!=="play"){ return; } pressing=true; unlock(); setTargetFromX(e.clientX); try{cv.setPointerCapture(e.pointerId);}catch(_){} });
  cv.addEventListener("pointermove", function(e){ if(pressing && state==="play") setTargetFromX(e.clientX); });
  window.addEventListener("pointerup", function(){ pressing=false; });
  window.addEventListener("pointercancel", function(){ pressing=false; });
  // 키보드
  var keyDir=0;
  window.addEventListener("keydown", function(e){
    if(state!=="play") return;
    if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") keyDir=-1;
    else if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") keyDir=1;
  });
  window.addEventListener("keyup", function(e){
    if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A"||e.key==="ArrowRight"||e.key==="d"||e.key==="D") keyDir=0;
  });
  // 키보드 이동을 목표에 반영
  setInterval(function(){ if(state==="play" && keyDir!==0){ squad.targetX = Math.max(roadL+8, Math.min(roadR-8, squad.targetX + keyDir*14)); } }, 30);

  window.addEventListener("pointerdown", unlock, {once:true});
  document.addEventListener("touchstart", unlock, {once:true, passive:true});

  // ---- init ----
  resize();
  buildLevel();
  render();
  document.getElementById("startOv").classList.add("show");
  hintEl.style.display="none";

  // 검증용 훅
  window.__runner = {
    start:startGame,
    getState:function(){ return { state:state, count:squad.count, traveled:Math.round(traveled), bossHp:boss.hp }; },
    tick:function(dt){ var was=running; running=true; update(dt); running=was; return this.getState(); },
    setCount:function(n){ squad.count=n; },
    jumpToBoss:function(){ traveled=boss.d; boss.arrived=true; },
    info:function(){ return { gates:gates.map(function(g){return {d:g.d,ops:g.ops.map(opText)};}), enemies:enemies.map(function(e){return {d:e.d,hp:e.maxhp};}), boss:{d:boss.d,hp:boss.maxhp}, trackEnd:TRACK_END }; }
  };
})();
</script>
</body>
</html>
