<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1220">
<title>돌격! 게이트 러너</title>
<style>
  :root{ color-scheme: dark; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html,body{ height:100%; overflow:hidden; background:#08101d; }
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple Color Emoji","Segoe UI Emoji",sans-serif; color:#fff; display:flex; align-items:center; justify-content:center; touch-action:none; }
  #frame{ position:relative; width:100vw; height:100vh; height:100dvh; max-width:520px; margin:0 auto; overflow:hidden; background:#0b1220; }
  @supports (height:100dvh){ #frame{ height:100dvh; } }
  canvas{ display:block; width:100%; height:100%; touch-action:none; }

  #hud{ position:absolute; left:0; right:0; top:0; padding:max(10px,env(safe-area-inset-top)) 14px 0; pointer-events:none; z-index:5; }
  .hrow{ display:flex; align-items:center; gap:10px; }
  .troops{ display:flex; align-items:center; gap:6px; background:rgba(0,0,0,.5); border:2px solid rgba(120,180,255,.55); padding:6px 13px; border-radius:16px; font-weight:900; box-shadow:0 3px 0 rgba(0,0,0,.35); }
  .troops .ico{ font-size:18px; }
  .troops #count{ font-size:24px; color:#8fd0ff; min-width:40px; text-align:left; text-shadow:0 0 12px rgba(90,170,255,.6); }
  .troops #count.flash{ animation:flash .26s ease; }
  @keyframes flash{ 0%{transform:scale(1)} 45%{transform:scale(1.5); color:#fff} 100%{transform:scale(1)} }
  #muteWrap{ margin-left:auto; pointer-events:auto; }
  #mute{ width:40px; height:40px; border-radius:12px; border:2px solid rgba(255,255,255,.2); background:rgba(0,0,0,.5); color:#fff; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #mute:active{ transform:scale(.9); }
  .barwrap{ margin-top:9px; display:flex; align-items:center; gap:7px; }
  .barouter{ flex:1; height:13px; border-radius:9px; background:rgba(0,0,0,.45); border:2px solid rgba(255,255,255,.18); overflow:hidden; position:relative; }
  #prog{ position:absolute; left:0; top:0; bottom:0; width:0%; background:linear-gradient(90deg,#3ee6a0,#ffd54a,#ff7a59); border-radius:6px; transition:width .1s linear; }
  .flag{ font-size:16px; filter:drop-shadow(0 0 5px rgba(255,180,60,.6)); }

  /* 튜토리얼 손가락 */
  #tut{ position:absolute; left:0; right:0; bottom:20%; z-index:8; display:none; flex-direction:column; align-items:center; pointer-events:none; }
  #tut.show{ display:flex; }
  #tut .hand{ font-size:46px; animation:swipe 1.1s ease-in-out infinite; filter:drop-shadow(0 4px 8px rgba(0,0,0,.6)); }
  @keyframes swipe{ 0%,100%{transform:translateX(-52px) rotate(-8deg)} 50%{transform:translateX(52px) rotate(8deg)} }
  #tut .tt{ margin-top:6px; font-weight:900; font-size:16px; color:#fff; background:rgba(0,0,0,.45); padding:5px 14px; border-radius:20px; border:2px solid rgba(255,255,255,.25); }

  .overlay{ position:absolute; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:26px; background:radial-gradient(120% 100% at 50% 0%, rgba(18,38,74,.94), rgba(5,10,22,.98)); }
  .overlay.show{ display:flex; animation:fade .3s ease; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .overlay .emo{ font-size:clamp(56px,18vw,100px); filter:drop-shadow(0 6px 20px rgba(0,0,0,.5)); }
  .win .emo{ animation:pop .6s ease; } @keyframes pop{ 0%{transform:scale(.3)} 60%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .overlay h1{ font-size:clamp(27px,8.5vw,42px); margin:8px 0 2px; -webkit-text-stroke:1px rgba(0,0,0,.25); }
  .win h1{ background:linear-gradient(90deg,#ffd54a,#8ff0a4); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .lose h1{ color:#ff6b6b; }
  .overlay p{ color:#cfe0ff; font-size:15px; line-height:1.55; max-width:310px; margin:4px 0; }
  .overlay .fake{ opacity:.5; text-decoration:line-through; }
  .overlay .fscore{ margin:8px 0 16px; font-size:18px; }
  .overlay .fscore b{ color:#ffe17a; font-size:30px; }
  .btn{ border:none; cursor:pointer; font-size:20px; font-weight:900; color:#08210f; padding:15px 34px; border-radius:16px; margin-top:6px; background:linear-gradient(90deg,#8ff0a4,#3ee6a0); box-shadow:0 6px 0 #1f9c68, 0 10px 24px rgba(60,220,150,.5); transition:transform .08s, box-shadow .08s; }
  .lose .btn{ color:#2a0f0f; background:linear-gradient(90deg,#ffb03c,#ff7a59); box-shadow:0 6px 0 #b5591f, 0 10px 24px rgba(255,140,80,.5); }
  .btn:active{ transform:translateY(4px); box-shadow:0 2px 0 #1f9c68, 0 6px 14px rgba(60,220,150,.4); }
  .badge{ margin-top:12px; font-size:12px; color:#8fb3d8; opacity:.8; }
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="hrow">
      <div class="troops"><span class="ico">🪖</span><span id="count">0</span><span style="opacity:.5;font-size:13px">명</span></div>
      <div id="muteWrap"><button id="mute" aria-label="소리">🔊</button></div>
    </div>
    <div class="barwrap"><div class="barouter"><div id="prog"></div></div><span class="flag">🏰</span></div>
  </div>

  <div id="tut"><div class="hand">👆</div><div class="tt">← 밀어서 이동 →</div></div>

  <div class="overlay" id="startOv">
    <div class="emo">🪖⚔️</div>
    <h1>돌격! 게이트 러너</h1>
    <p>손가락으로 <b>좌우로 쓱</b> 밀어 병력을 조종!<br><b>초록 게이트</b>로 불리고 적을 갈아버린 뒤<br><b>🏰 성문</b>을 폭파하세요!</p>
    <button class="btn" id="startBtn">▶ 출격</button>
    <div class="badge">모든 그래픽·사운드 자체 제작 · 광고 패러디</div>
  </div>
  <div class="overlay win" id="winOv">
    <div class="emo">🏆</div>
    <h1>성문 함락! 대승!</h1>
    <div class="fscore">최종 병력 <b id="winCount">0</b>명</div>
    <p><span class="fake">지금 설치하고 무적 군단 받기!</span><br>…는 농담이고 🔁 한 판 더 하시죠.</p>
    <button class="btn" id="winBtn">🔁 다시하기</button>
  </div>
  <div class="overlay lose" id="loseOv">
    <div class="emo">💀</div>
    <h1>전멸…</h1>
    <p id="loseMsg">병력이 모두 쓰러졌습니다.</p>
    <button class="btn" id="loseBtn">🔁 다시하기</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
  var frameEl=document.getElementById("frame");
  var countEl=document.getElementById("count"), progEl=document.getElementById("prog");
  var tutEl=document.getElementById("tut"), muteBtn=document.getElementById("mute");

  var W=360,H=640,DPR=1;
  function resize(){
    var r=frameEl.getBoundingClientRect();
    W=Math.max(220,r.width); H=Math.max(360,r.height);
    DPR=Math.min(window.devicePixelRatio||1,2.5);
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
    cv.style.width=W+"px"; cv.style.height=H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    roadBounds();
  }
  window.addEventListener("resize",resize);

  /* ---------- Audio ---------- */
  var audio={ctx:null,muted:false,ok:false};
  function initAudio(){ if(audio.ctx||audio.muted) return; try{ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; audio.ctx=new AC(); audio.ok=true; }catch(e){ audio.ok=false; } }
  function unlock(){ initAudio(); try{ if(audio.ctx&&audio.ctx.state==="suspended") audio.ctx.resume(); }catch(e){} }
  function tone(freq,dur,type,vol,slideTo){
    if(!audio.ok||audio.muted||!audio.ctx) return;
    try{ var t=audio.ctx.currentTime,o=audio.ctx.createOscillator(),g=audio.ctx.createGain();
      o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
      if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+dur);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.08,t+0.006);
      g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
      o.connect(g); g.connect(audio.ctx.destination); o.start(t); o.stop(t+dur+0.02);
    }catch(e){}
  }
  function kick(vol){ // 저음 펀치
    if(!audio.ok||audio.muted||!audio.ctx) return;
    try{ var t=audio.ctx.currentTime,o=audio.ctx.createOscillator(),g=audio.ctx.createGain();
      o.type="sine"; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(38,t+0.18);
      g.gain.setValueAtTime(vol||0.16,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g); g.connect(audio.ctx.destination); o.start(t); o.stop(t+0.24);
    }catch(e){}
  }
  function noise(dur,vol,cut){
    if(!audio.ok||audio.muted||!audio.ctx) return;
    try{ var sr=audio.ctx.sampleRate,n=Math.floor(sr*dur),buf=audio.ctx.createBuffer(1,n,sr),d=buf.getChannelData(0);
      for(var i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      var s=audio.ctx.createBufferSource(); s.buffer=buf;
      var g=audio.ctx.createGain(); g.gain.setValueAtTime(vol||0.12,audio.ctx.currentTime);
      var f=audio.ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=cut||1400;
      s.connect(f); f.connect(g); g.connect(audio.ctx.destination); s.start();
    }catch(e){}
  }
  var lastShot=0;
  function sfxShot(){ var n=performance.now(); if(n-lastShot<48) return; lastShot=n; tone(760,0.035,"square",0.02,520); }
  function sfxHit(){ tone(260,0.05,"square",0.05,120); }
  function sfxKill(){ noise(0.14,0.12,1600); tone(150,0.1,"sawtooth",0.05,50); kick(0.09); }
  function sfxBigKill(){ noise(0.22,0.16,1800); kick(0.16); }
  function sfxEnemyShot(){ tone(300,0.045,"sawtooth",0.018,180); }
  function sfxGood(){ tone(560,0.12,"triangle",0.12,1120); tone(840,0.1,"triangle",0.07,1400); }
  function sfxBad(){ tone(260,0.24,"sawtooth",0.12,70); }
  function sfxCombo(n){ tone(520+n*40,0.12,"square",0.08,900+n*60); }
  function sfxWin(){ [523,659,784,1046,1318,1568].forEach(function(f,i){ setTimeout(function(){ tone(f,0.24,"triangle",0.14,f*1.01); },i*100); }); noise(0.5,0.16,1800); kick(0.2); }
  function sfxLose(){ [420,320,220,130].forEach(function(f,i){ setTimeout(function(){ tone(f,0.26,"sawtooth",0.12,f*0.6); },i*130); }); }
  function sfxBoom(){ noise(0.4,0.2,2000); kick(0.22); tone(80,0.35,"sawtooth",0.12,32); }
  muteBtn.addEventListener("click",function(e){ e.stopPropagation(); audio.muted=!audio.muted; muteBtn.textContent=audio.muted?"🔇":"🔊"; if(!audio.muted) unlock(); });

  /* ---------- State ---------- */
  var state="start";
  var squad, pBullets, eBullets, enemies, barricades, gates, boss, parts, floats;
  var traveled, speed, roadL, roadR, squadY, fireCd, timePrev, running=false;
  var TRACK_END, shakeMag=0, hitstop=0, gameTime=0, BOSS_GAP=0;
  var flashAlpha=0, slowT=0, combo=0, comboT=0, tutTimer=0;

  function roadBounds(){ roadL=W*0.11; roadR=W*0.89; }
  function roadMid(){ return (roadL+roadR)/2; }
  function screenY(d){ return squadY-(d-traveled); }
  function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

  var MAX_PART=320, MAX_PB=240, MAX_EB=150;

  function buildLevel(){
    roadBounds();
    squad={ x:roadMid(), targetX:roadMid(), count:8 };
    pBullets=[]; eBullets=[]; enemies=[]; barricades=[]; gates=[]; parts=[]; floats=[];
    traveled=0; speed=155; fireCd=0; squadY=H*0.82; gameTime=0; shakeMag=0; hitstop=0;
    flashAlpha=0; slowT=0; combo=0; comboT=0; tutTimer=3.6;

    function gate(d,L,R){ gates.push({d:d,ops:[L,R],consumed:false}); }
    function barr(d,hp){ barricades.push({d:d,x:roadMid(),w:(roadR-roadL)*0.66,hp:hp,maxhp:hp,alive:true,flash:0,kb:0}); }
    function wave(d,n,hp){ for(var i=0;i<n;i++){ var col=i%4; var row=Math.floor(i/4);
      enemies.push({ d:d+row*46+Math.random()*14, x:roadL+(roadR-roadL)*(0.18+0.21*col)+(Math.random()*10-5), hp:hp, maxhp:hp, alive:true, flash:0, kb:0, fireCd:0.6+Math.random()*1.2, bob:Math.random()*6 }); } }

    gate(560,{t:'add',v:10},{t:'mul',v:2});
    wave(760,4,3); barr(1000,26);
    gate(1250,{t:'mul',v:3},{t:'sub',v:6});
    wave(1480,7,4); wave(1560,3,3); barr(1820,46);
    gate(2080,{t:'div',v:2},{t:'add',v:26});
    wave(2320,9,4);
    gate(2650,{t:'mul',v:2},{t:'add',v:16});
    barr(2900,66); wave(3150,8,5);
    gate(3480,{t:'add',v:22},{t:'mul',v:2});
    wave(3620,12,5); wave(3720,6,5);
    boss={ d:4300, hp:240, maxhp:240, alive:true, arrived:false, drainCd:0, fireCd:0.4, flash:0 };
    BOSS_GAP=squadY-H*0.24;
    TRACK_END=boss.d-BOSS_GAP;
    updateHud();
  }

  function opText(op){ var s=op.t==='mul'?'×':op.t==='add'?'+':op.t==='sub'?'−':'÷'; return s+op.v; }
  function opGood(op){ return op.t==='mul'||op.t==='add'; }
  function applyOp(op){ var c=squad.count,nc=c; if(op.t==='mul')nc=c*op.v; else if(op.t==='add')nc=c+op.v; else if(op.t==='sub')nc=c-op.v; else nc=Math.floor(c/op.v); nc=Math.max(0,Math.floor(nc)); var good=nc>=c; squad.count=nc; return good; }

  function updateHud(){ countEl.textContent=squad.count; countEl.classList.remove("flash"); void countEl.offsetWidth; countEl.classList.add("flash"); progEl.style.width=Math.min(100,traveled/TRACK_END*100).toFixed(1)+"%"; }

  /* effects */
  function spark(x,y,color,n,spd){ for(var i=0;i<(n||6);i++){ if(parts.length>=MAX_PART) break; var a=Math.random()*Math.PI*2,s=(spd||100)*(0.3+Math.random()); parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:240+Math.random()*220,color:color,r:1.6+Math.random()*2.8,t:'spark'}); } }
  function smoke(x,y,n){ for(var i=0;i<(n||6);i++){ if(parts.length>=MAX_PART) break; var a=Math.random()*Math.PI*2,s=18+Math.random()*40; parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-18,life:0,max:440+Math.random()*320,r:4+Math.random()*6,t:'smoke'}); } }
  function ring(x,y,color,r0,r1,dur){ if(parts.length<MAX_PART) parts.push({x:x,y:y,life:0,max:dur||300,r0:r0||4,r1:r1||34,color:color,t:'ring'}); }
  function debris(x,y,color,n){ for(var i=0;i<(n||8);i++){ if(parts.length>=MAX_PART) break; var a=Math.random()*Math.PI*2,s=120+Math.random()*160; parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:0,max:400+Math.random()*260,color:color,r:2+Math.random()*3,t:'debris',rot:Math.random()*6}); } }
  function dmgNum(x,y,val,color,big){ floats.push({x:x+(Math.random()*10-5),y:y,text:(val>0?"-":"")+Math.abs(val),color:color||"#fff",life:0,max:big?820:640,vy:-58,big:big?1:0}); }
  function popText(x,y,text,color){ floats.push({x:x,y:y,text:text,color:color,life:0,max:900,vy:-42,big:2}); }
  function doShake(m){ shakeMag=Math.min(22,Math.max(shakeMag,m)); }
  function doStop(t){ hitstop=Math.max(hitstop,t); }
  function doFlash(a){ flashAlpha=Math.max(flashAlpha,a); }
  function doSlow(t){ slowT=Math.max(slowT,t); }
  function addCombo(x,y){ combo++; comboT=1.5; if(combo>=3){ var w=combo>=12?"UNSTOPPABLE!":combo>=8?"RAMPAGE!":combo>=5?"PERFECT!":"NICE!"; popText(roadMid(),H*0.34,combo+" COMBO · "+w,"#ffe36b"); sfxCombo(combo); } }

  /* ---------- Update ---------- */
  function update(dtRaw){
    if(state!=="play") return;
    // 입력 반응은 항상 (히트스톱/슬로모와 무관하게 좌우 이동 유지)
    squad.x+=(squad.targetX-squad.x)*Math.min(1,dtRaw*20);
    squad.x=clamp(squad.x,roadL+10,roadR-10);
    if(tutTimer>0){ tutTimer-=dtRaw; if(tutTimer<=0) tutEl.classList.remove("show"); }

    if(hitstop>0){ hitstop-=dtRaw; if(hitstop>0){ return; } }
    var dt=dtRaw*(slowT>0?0.4:1); if(slowT>0) slowT-=dtRaw;
    gameTime+=dt;
    if(flashAlpha>0){ flashAlpha-=dtRaw*3.2; if(flashAlpha<0) flashAlpha=0; }
    if(comboT>0){ comboT-=dt; if(comboT<=0) combo=0; }

    if(!boss.arrived){ traveled+=speed*dt; if(traveled>=boss.d-BOSS_GAP){ traveled=boss.d-BOSS_GAP; boss.arrived=true; } }
    progEl.style.width=Math.min(100,traveled/TRACK_END*100).toFixed(1)+"%";

    /* fire */
    fireCd-=dt;
    if(fireCd<=0 && squad.count>0){
      fireCd=0.10;
      var nb=Math.max(1,Math.min(9,1+Math.floor(squad.count/5)));
      var spread=Math.min((roadR-roadL)*0.5,10+squad.count*0.55);
      for(var i=0;i<nb;i++){ if(pBullets.length>=MAX_PB) break; var off=nb===1?0:(-spread/2+spread*(i/(nb-1))); pBullets.push({x:squad.x+off,y:squadY-18,vy:-680}); }
      sfxShot();
      if(parts.length<MAX_PART) parts.push({x:squad.x,y:squadY-16,life:0,max:55,color:"#fff2a8",r:8,t:'flash'});
    }
    for(var b=pBullets.length-1;b>=0;b--){ var bl=pBullets[b]; bl.y+=bl.vy*dt; if(bl.y<-24) pBullets.splice(b,1); }
    for(var eb=eBullets.length-1;eb>=0;eb--){ var ebl=eBullets[eb]; ebl.y+=ebl.vy*dt; ebl.x+=(ebl.vx||0)*dt;
      if(ebl.y>H+24){ eBullets.splice(eb,1); continue; }
      if(ebl.y>=squadY-14 && ebl.y<=squadY+20 && Math.abs(ebl.x-squad.x)<squadHalf()){ eBullets.splice(eb,1); squad.count=Math.max(0,squad.count-1); spark(ebl.x,squadY-6,"#9fd0ff",7,120); doShake(3.5); updateHud(); if(squad.count<=0) return gameOver("적의 반격에 부대가 무너졌습니다."); }
    }

    /* gates */
    for(var g=0;g<gates.length;g++){ var gt=gates[g]; if(gt.consumed) continue;
      if(traveled>=gt.d){ gt.consumed=true; var op=gt.ops[squad.x>roadMid()?1:0]; var good=applyOp(op);
        popText(squad.x,squadY-40,(good?"▲ ":"▼ ")+opText(op),good?"#8ff0a4":"#ff6b6b");
        spark(squad.x,squadY-10,good?"#8ff0a4":"#ff6b6b",18,150); ring(squad.x,squadY-10,good?"#8ff0a4":"#ff6b6b",8,40,280);
        good?sfxGood():sfxBad(); doShake(good?5:8); doFlash(good?0.18:0.28); if(good) doSlow(0.12); updateHud();
        if(squad.count<=0) return gameOver("게이트 함정에 병력을 잃었습니다.");
      }
    }

    /* barricades */
    for(var k=0;k<barricades.length;k++){ var br=barricades[k]; if(!br.alive) continue; var by=screenY(br.d);
      if(br.flash>0) br.flash-=dt; if(br.kb>0) br.kb-=dt*70;
      if(by>-70 && by<H+70){
        for(var bi=pBullets.length-1;bi>=0;bi--){ var pb=pBullets[bi];
          if(pb.y<=by+20 && pb.y>=by-20 && pb.x>br.x-br.w/2 && pb.x<br.x+br.w/2){ br.hp-=1; pBullets.splice(bi,1); br.flash=0.07; br.kb=3.5; spark(pb.x,by+8,"#ffd27a",4,90);
            if(br.hp<=0){ br.alive=false; smoke(br.x,by,16); debris(br.x,by,"#7a4d34",14); spark(br.x,by,"#ff9a5a",26,190); ring(br.x,by,"#ffb060",10,70,340); sfxBigKill(); doShake(9); doStop(0.05); doFlash(0.2); break; }
          }
        }
      }
      if(br.alive && traveled>=br.d){ br.alive=false; var loss=br.hp; squad.count=Math.max(0,squad.count-loss); dmgNum(squad.x,squadY-24,loss,"#ff6b6b",1); spark(squad.x,squadY,"#ff6b6b",18,160); smoke(squad.x,squadY-10,10); sfxHit(); kick(0.1); doShake(9); doStop(0.05); updateHud(); if(squad.count<=0) return gameOver("바리케이드를 넘지 못했습니다."); }
    }

    /* enemies */
    var killsThisFrame=0;
    for(var e=0;e<enemies.length;e++){ var en=enemies[e]; if(!en.alive) continue; var ey=screenY(en.d);
      if(en.flash>0) en.flash-=dt; if(en.kb>0) en.kb-=dt*90;
      if(ey>-40 && ey<H+40){
        en.fireCd-=dt;
        if(en.fireCd<=0 && ey<squadY-40 && eBullets.length<MAX_EB){ en.fireCd=1.1+Math.random()*1.3; var dx=(squad.x-en.x); var norm=Math.max(1,Math.abs(dx)); eBullets.push({x:en.x,y:ey+8,vy:300,vx:clamp(dx/norm*40,-60,60)}); sfxEnemyShot(); }
        for(var bi2=pBullets.length-1;bi2>=0;bi2--){ var pb2=pBullets[bi2];
          if(pb2.y<=ey+12 && pb2.y>=ey-12 && Math.abs(pb2.x-en.x)<11){ en.hp-=1; pBullets.splice(bi2,1); en.flash=0.09; en.kb=6; spark(pb2.x,ey,"#fff",5,100);
            if(en.hp<=0){ en.alive=false; smoke(en.x,ey,7); debris(en.x,ey,"#c23a3a",9); spark(en.x,ey,"#ff6a6a",16,170); ring(en.x,ey,"#ff8a8a",6,26,240); sfxKill(); killsThisFrame++; addCombo(en.x,ey); break; }
          }
        }
      }
      if(en.alive && traveled>=en.d){ en.alive=false; squad.count=Math.max(0,squad.count-2); spark(squad.x,squadY,"#ff6b6b",8,120); dmgNum(squad.x,squadY-20,2,"#ff6b6b"); sfxHit(); doShake(4); updateHud(); if(squad.count<=0) return gameOver("적 병력에 파묻혔습니다."); }
    }
    if(killsThisFrame>=3){ doShake(6+killsThisFrame); doStop(0.05); doFlash(0.16); }
    else if(killsThisFrame>=1){ doShake(2.5); }

    /* boss */
    if(boss.arrived && boss.alive){ var byy=screenY(boss.d); if(boss.flash>0) boss.flash-=dt;
      for(var bi3=pBullets.length-1;bi3>=0;bi3--){ var pb3=pBullets[bi3];
        if(pb3.y<=byy+46 && pb3.x>roadL && pb3.x<roadR){ boss.hp-=1; pBullets.splice(bi3,1); boss.flash=0.06; if(pb3.y<byy) spark(pb3.x,byy+30,"#ffd27a",2,80); if((boss.hp%12)===0){ sfxHit(); doShake(3.5); } }
      }
      if(boss.hp<=0){ boss.alive=false; return bossDie(byy); }
      boss.fireCd-=dt;
      if(boss.fireCd<=0 && eBullets.length<MAX_EB-6){ boss.fireCd=0.85; for(var v=-2;v<=2;v++){ eBullets.push({x:roadMid()+v*26,y:byy+30,vy:330,vx:v*22}); } sfxEnemyShot(); }
      boss.drainCd-=dt;
      if(boss.drainCd<=0){ boss.drainCd=0.9; var d2=Math.max(2,Math.round(squad.count*0.05)+2); squad.count=Math.max(0,squad.count-d2); dmgNum(squad.x,squadY-22,d2,"#ff6b6b"); updateHud(); if(squad.count<=0) return gameOver("성문 앞에서 부대가 무너졌습니다."); }
    }

    /* particles / floats */
    for(var p=parts.length-1;p>=0;p--){ var pt=parts[p]; pt.life+=dt*1000;
      if(pt.t==='smoke'){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=0.94; pt.vy*=0.94; }
      else if(pt.t==='debris'){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=dt*260; }
      else if(pt.t==='spark'){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=dt*70; }
      if(pt.life>=pt.max) parts.splice(p,1);
    }
    for(var f=floats.length-1;f>=0;f--){ var ff=floats[f]; ff.life+=dt*1000; ff.y+=ff.vy*dt; ff.vy*=0.92; if(ff.life>=ff.max) floats.splice(f,1); }
    if(shakeMag>0){ shakeMag-=dtRaw*45; if(shakeMag<0) shakeMag=0; }
  }
  function squadHalf(){ return Math.max(16,Math.min((roadR-roadL)*0.32,14+squad.count*0.5)); }

  function bossDie(byy){
    for(var i=0;i<3;i++){ smoke(roadMid()+(Math.random()*120-60),byy+(Math.random()*40-20),10); }
    debris(roadMid(),byy,"#6b6470",26); spark(roadMid(),byy,"#ffd54a",60,280); spark(roadMid(),byy,"#ff8c3a",50,340);
    ring(roadMid(),byy,"#ffd54a",20,180,600); ring(roadMid(),byy,"#fff",10,120,420);
    sfxBoom(); setTimeout(sfxWin,200); doShake(22); doStop(0.09); doFlash(0.85); doSlow(0.6);
    setTimeout(win,560);
  }

  /* ---------- Render ---------- */
  function lerp(a,b,t){ return a+(b-a)*t; }
  function progFrac(){ return Math.min(1,traveled/TRACK_END); }
  function outText(text,x,y,fill,size,weight){ ctx.font=(weight||800)+" "+size+"px -apple-system,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineWidth=Math.max(3,size*0.16); ctx.strokeStyle="rgba(0,0,0,.75)"; ctx.strokeText(text,x,y); ctx.fillStyle=fill; ctx.fillText(text,x,y); }

  function drawBackground(){
    var pf=progFrac();
    var g1="rgb("+(lerp(20,44,pf)|0)+","+(lerp(56,42,pf)|0)+","+(lerp(33,46,pf)|0)+")";
    var g2="rgb("+(lerp(12,26,pf)|0)+","+(lerp(40,24,pf)|0)+","+(lerp(23,30,pf)|0)+")";
    var grad=ctx.createLinearGradient(0,0,0,H); grad.addColorStop(0,g1); grad.addColorStop(1,g2);
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
    var farOff=(traveled*0.35)%160;
    ctx.fillStyle=pf<0.6?"rgba(30,64,44,.5)":"rgba(62,56,72,.5)";
    for(var y=-farOff-160;y<H;y+=160){ ctx.beginPath(); for(var x=0;x<=W;x+=40){ ctx.lineTo(x,y+40-(18+(Math.sin((x+y)*0.05)+1)*10)); } ctx.lineTo(W,y+50); ctx.lineTo(0,y+50); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle=pf<0.6?"#2b3140":"#34313b"; ctx.fillRect(roadL,0,roadR-roadL,H);
    ctx.fillStyle="rgba(255,255,255,.06)"; ctx.fillRect(roadL,0,3,H); ctx.fillRect(roadR-3,0,3,H);
    var nearOff=(traveled)%90;
    for(var yy=-nearOff-90;yy<H;yy+=90){ tuft(roadL-12,yy+20,pf); tuft(roadR+12,yy+64,pf); tuft(roadL-24,yy+70,pf); tuft(roadR+24,yy+30,pf); }
    ctx.fillStyle="rgba(255,255,255,.17)"; var dash=34,gap=30,cx=roadMid(),off=(traveled%(dash+gap));
    for(var yd=-off;yd<H;yd+=dash+gap){ ctx.fillRect(cx-3,yd,6,dash); }
  }
  function tuft(x,y,pf){ if(pf<0.6){ ctx.fillStyle="rgba(64,124,72,.5)"; ctx.beginPath(); ctx.ellipse(x,y,7,4,0,0,Math.PI*2); ctx.fill(); } else { ctx.fillStyle="rgba(92,90,102,.55)"; ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); } }

  function soldier(x,y,body,head,bob,up){
    var yy=y+bob;
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x,yy+7,5,2,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=body; roundRect(x-4,yy-2,8,9,3); ctx.fill();
    ctx.fillStyle=head; ctx.beginPath(); ctx.arc(x,yy-5,3.2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,yy-6,3.4,Math.PI,0); ctx.fill();
    ctx.strokeStyle="#1c2027"; ctx.lineWidth=1.7; ctx.beginPath(); if(up){ ctx.moveTo(x+3,yy+1); ctx.lineTo(x+3,yy-6); } else { ctx.moveTo(x-3,yy+1); ctx.lineTo(x-3,yy+7); } ctx.stroke();
  }
  function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  function drawGates(){
    for(var g=0;g<gates.length;g++){ var gt=gates[g]; if(gt.consumed) continue; var y=screenY(gt.d); if(y<-90||y>H+90) continue;
      var mid=roadMid(), segs=[[roadL,mid,gt.ops[0]],[mid,roadR,gt.ops[1]]];
      for(var s=0;s<2;s++){ var x0=segs[s][0],x1=segs[s][1],op=segs[s][2],good=opGood(op);
        var grd=ctx.createLinearGradient(0,y-38,0,y+38);
        if(good){ grd.addColorStop(0,"rgba(60,235,150,.14)"); grd.addColorStop(1,"rgba(60,235,150,.5)"); } else { grd.addColorStop(0,"rgba(255,70,70,.14)"); grd.addColorStop(1,"rgba(255,70,70,.5)"); }
        ctx.fillStyle=grd; ctx.fillRect(x0+3,y-38,(x1-x0)-6,76);
        ctx.strokeStyle=good?"#8dffc6":"#ff8a8a"; ctx.lineWidth=3.5; ctx.strokeRect(x0+3,y-38,(x1-x0)-6,76);
        outText((good?"▲ ":"▼ ")+opText(op),(x0+x1)/2,y,"#fff",28,900);
      }
    }
  }
  function drawBarricades(){
    for(var k=0;k<barricades.length;k++){ var br=barricades[k]; if(!br.alive) continue; var y=screenY(br.d)-(br.kb||0); if(y<-70||y>H+70) continue;
      var w=br.w,h=30,x=br.x;
      ctx.fillStyle="#5a3b2a"; ctx.fillRect(x-w/2,y-h/2,w,h);
      ctx.fillStyle="#7a4d34"; for(var s=0;s<3;s++){ ctx.fillRect(x-w/2,y-h/2+s*10+1,w,3); }
      ctx.strokeStyle="#2f2118"; ctx.lineWidth=2.5; ctx.strokeRect(x-w/2,y-h/2,w,h);
      if(br.flash>0){ ctx.fillStyle="rgba(255,255,255,"+(br.flash/0.07*0.7)+")"; ctx.fillRect(x-w/2,y-h/2,w,h); }
      ctx.fillStyle="rgba(0,0,0,.55)"; ctx.fillRect(x-w/2,y-h/2-9,w,6); ctx.fillStyle="#ff5555"; ctx.fillRect(x-w/2,y-h/2-9,w*Math.max(0,br.hp/br.maxhp),6);
      outText(br.hp,x,y,"#fff",17,800);
    }
  }
  function drawEnemies(){
    for(var e=0;e<enemies.length;e++){ var en=enemies[e]; if(!en.alive) continue; var y=screenY(en.d); if(y<-30||y>H+30) continue;
      var bob=Math.sin(gameTime*7+en.bob)*1.5;
      soldier(en.x,y-(en.kb||0),"#d23a3a","#eeb89a",bob,false);
      if(en.flash>0){ ctx.fillStyle="rgba(255,255,255,"+(en.flash/0.09)+")"; ctx.beginPath(); ctx.arc(en.x,y-5,9,0,Math.PI*2); ctx.fill(); }
    }
  }
  function drawBoss(){
    if(!boss.alive) return; var y=screenY(boss.d); if(y<-140||y>H+140) return;
    var w=(roadR-roadL)*0.96,x=roadMid();
    ctx.fillStyle="#4a4550"; ctx.fillRect(x-w/2,y-30,w,64); ctx.fillStyle="#39343f"; ctx.fillRect(x-w/2,y-30,w,10);
    for(var i=0;i<7;i++){ ctx.fillStyle="#544d5b"; ctx.fillRect(x-w/2+i*(w/7),y-44,w/7-4,14); }
    ctx.fillStyle="#2a2530"; roundRect(x-22,y-6,44,40,8); ctx.fill();
    ctx.font="34px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("🏰",x,y-56);
    if(boss.flash>0){ ctx.fillStyle="rgba(255,255,255,"+(boss.flash/0.06*0.55)+")"; ctx.fillRect(x-w/2,y-44,w,78); }
    var bw=w*0.92; ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(x-bw/2,y-62,bw,11); ctx.fillStyle="#ff3d3d"; ctx.fillRect(x-bw/2,y-62,bw*Math.max(0,boss.hp/boss.maxhp),11); ctx.strokeStyle="#fff"; ctx.lineWidth=1.6; ctx.strokeRect(x-bw/2,y-62,bw,11);
    outText("성문 HP "+Math.max(0,boss.hp),x,y-72,"#fff",14,800);
  }
  function drawBullets(){
    ctx.fillStyle="#ffe27a"; for(var b=0;b<pBullets.length;b++){ var bl=pBullets[b]; ctx.fillRect(bl.x-2,bl.y-9,4,13); }
    ctx.fillStyle="#ff5b5b"; for(var e=0;e<eBullets.length;e++){ var el=eBullets[e]; ctx.beginPath(); ctx.arc(el.x,el.y,3.4,0,Math.PI*2); ctx.fill(); }
  }
  function drawSquad(){
    var n=Math.max(0,squad.count), shown=Math.min(n,46);
    var spreadW=Math.min((roadR-roadL)*0.62,30+n*0.9); var perRow=Math.max(4,Math.round(Math.sqrt(shown*1.6)));
    for(var i=0;i<shown;i++){ var row=Math.floor(i/perRow),col=i%perRow,rowN=Math.min(perRow,shown-row*perRow);
      var gx=squad.x+((col-(rowN-1)/2)/Math.max(1,perRow-1))*spreadW+Math.sin(i*12.9)*1.5; var gy=squadY+row*10+4; var bob=Math.sin(gameTime*9+i*0.7)*1.6;
      soldier(gx,gy,"#2f6dd0","#e8c39e",bob,true);
    }
    if(n>shown){ outText("+"+(n-shown),squad.x,squadY+44,"#fff",13,800); }
  }
  function drawParts(){
    for(var p=0;p<parts.length;p++){ var pt=parts[p], a=1-pt.life/pt.max; if(a<0)a=0;
      if(pt.t==='ring'){ var rr=lerp(pt.r0,pt.r1,pt.life/pt.max); ctx.globalAlpha=a; ctx.strokeStyle=pt.color; ctx.lineWidth=3*a+0.5; ctx.beginPath(); ctx.arc(pt.x,pt.y,rr,0,Math.PI*2); ctx.stroke(); }
      else if(pt.t==='smoke'){ ctx.globalAlpha=0.4*a; ctx.fillStyle="rgb(120,120,132)"; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*(1+(1-a)*1.3),0,Math.PI*2); ctx.fill(); }
      else if(pt.t==='flash'){ ctx.globalAlpha=a; ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r*(1+(1-a)),0,Math.PI*2); ctx.fill(); }
      else { ctx.globalAlpha=a; ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,Math.PI*2); ctx.fill(); }
    }
    ctx.globalAlpha=1;
    for(var f=0;f<floats.length;f++){ var ff=floats[f], k=ff.life/ff.max, a2=1-k; ctx.globalAlpha=Math.max(0,a2);
      var sc=ff.big?(1+Math.max(0,0.5-k)*1.2):1; var sz=(ff.big===2?24:ff.big?20:15)*sc;
      ctx.lineWidth=Math.max(3,sz*0.18); ctx.strokeStyle="rgba(0,0,0,.8)"; ctx.font="900 "+sz+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.strokeText(ff.text,ff.x,ff.y); ctx.fillStyle=ff.color; ctx.fillText(ff.text,ff.x,ff.y);
    }
    ctx.globalAlpha=1;
  }
  function drawComboHud(){ if(state==="play"&&combo>=3&&comboT>0){ ctx.globalAlpha=Math.min(1,comboT); outText("🔥 "+combo+" COMBO",roadMid(),H*0.15,"#ffd54a",Math.min(30,18+combo),900); ctx.globalAlpha=1; } }

  function render(){
    ctx.save();
    if(shakeMag>0) ctx.translate((Math.random()-0.5)*shakeMag,(Math.random()-0.5)*shakeMag);
    drawBackground(); drawGates(); drawBarricades(); drawEnemies(); drawBoss(); drawBullets(); drawSquad(); drawParts();
    ctx.restore();
    drawComboHud();
    if(flashAlpha>0){ ctx.fillStyle="rgba(255,255,255,"+Math.min(0.85,flashAlpha)+")"; ctx.fillRect(0,0,W,H); }
  }

  /* ---------- Loop ---------- */
  function loop(ts){
    if(!running) return;
    if(!timePrev) timePrev=ts;
    var dt=(ts-timePrev)/1000; timePrev=ts;
    if(dt>0.05) dt=0.05; if(dt<0) dt=0;   // 백그라운드 복귀 시 dt 튐 방지
    update(dt); render();
    requestAnimationFrame(loop);
  }

  /* ---------- Flow ---------- */
  function startGame(){
    unlock(); resize(); buildLevel();
    state="play"; running=true; timePrev=0; pressing=false; activeId=null;
    document.getElementById("startOv").classList.remove("show");
    document.getElementById("winOv").classList.remove("show");
    document.getElementById("loseOv").classList.remove("show");
    tutEl.classList.add("show");
    requestAnimationFrame(loop);
  }
  function win(){ state="win"; running=false; pressing=false; tutEl.classList.remove("show"); document.getElementById("winCount").textContent=squad.count; document.getElementById("winOv").classList.add("show"); }
  function gameOver(msg){ state="lose"; running=false; pressing=false; tutEl.classList.remove("show"); sfxLose(); document.getElementById("loseMsg").textContent=msg||"병력이 모두 쓰러졌습니다."; document.getElementById("loseOv").classList.add("show"); }
  document.getElementById("startBtn").addEventListener("click",startGame);
  document.getElementById("winBtn").addEventListener("click",startGame);
  document.getElementById("loseBtn").addEventListener("click",startGame);

  /* ---------- Input (전역·견고) ---------- */
  var pressing=false, activeId=null;
  function xFromClient(clientX){ var r=cv.getBoundingClientRect(); return clamp(clientX-r.left,roadL+10,roadR-10); }
  function onDown(e){
    if(state!=="play") return;
    if(e.target && e.target.closest && e.target.closest("#muteWrap")) return; // 음소거 버튼은 제외
    unlock(); pressing=true; activeId=(e.pointerId!==undefined?e.pointerId:0);
    squad.targetX=xFromClient(e.clientX!==undefined?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:roadMid()));
  }
  function onMove(e){
    if(!pressing||state!=="play") return;
    var cx=e.clientX; if(cx===undefined && e.touches && e.touches[0]) cx=e.touches[0].clientX;
    if(cx!==undefined) squad.targetX=xFromClient(cx);
  }
  function onUp(){ pressing=false; activeId=null; }
  // 전역 리스너: 손가락이 캔버스 밖으로 나가도 유지, 어떤 상황에서도 끊기지 않게
  window.addEventListener("pointerdown",onDown,{passive:true});
  window.addEventListener("pointermove",onMove,{passive:true});
  window.addEventListener("pointerup",onUp,{passive:true});
  window.addEventListener("pointercancel",onUp,{passive:true});
  // 터치 폴백 (구형/특수 환경)
  window.addEventListener("touchstart",function(e){ onDown(e); },{passive:true});
  window.addEventListener("touchmove",function(e){ onMove(e); },{passive:true});
  window.addEventListener("touchend",onUp,{passive:true});
  window.addEventListener("touchcancel",onUp,{passive:true});
  // 포커스 이탈/탭 전환 시 안전 리셋 + 복귀 시 dt 정상화
  window.addEventListener("blur",onUp);
  document.addEventListener("visibilitychange",function(){ onUp(); if(!document.hidden){ timePrev=0; } });
  // 키보드
  var keyDir=0;
  window.addEventListener("keydown",function(e){ if(state!=="play") return; if(e.key==="ArrowLeft"||e.key==="a"||e.key==="A") keyDir=-1; else if(e.key==="ArrowRight"||e.key==="d"||e.key==="D") keyDir=1; });
  window.addEventListener("keyup",function(e){ if(["ArrowLeft","a","A","ArrowRight","d","D"].indexOf(e.key)>=0) keyDir=0; });
  setInterval(function(){ if(state==="play"&&keyDir!==0){ squad.targetX=clamp(squad.targetX+keyDir*15,roadL+10,roadR-10); } },30);
  window.addEventListener("pointerdown",unlock,{once:true});
  document.addEventListener("touchstart",unlock,{once:true,passive:true});

  /* ---------- init ---------- */
  resize(); buildLevel(); render();
  document.getElementById("startOv").classList.add("show");

  window.__runner={
    start:startGame,
    getState:function(){ return {state:state,count:squad.count,traveled:Math.round(traveled),bossHp:boss.hp,enemiesAlive:enemies.filter(function(e){return e.alive;}).length,eBullets:eBullets.length,pBullets:pBullets.length,parts:parts.length,pressing:pressing,combo:combo}; },
    tick:function(dt){ var w=running; running=true; update(dt); running=w; return this.getState(); },
    setCount:function(n){ squad.count=n; },
    setTarget:function(x){ squad.targetX=clamp(x,roadL+10,roadR-10); },
    jumpToBoss:function(){ enemies.forEach(function(e){e.alive=false;}); barricades.forEach(function(b){b.alive=false;}); traveled=boss.d-BOSS_GAP; boss.arrived=true; },
    info:function(){ return {gates:gates.length,enemies:enemies.length,barricades:barricades.length,boss:boss.maxhp,trackEnd:TRACK_END}; }
  };
})();
</script>
</body>
