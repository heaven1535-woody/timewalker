<style>

  }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

    color:#fff; align-items:center; justify-content:center; text-align:center;
    padding:calc(24px + env(safe-area-inset-top)) 24px;
  }
  #rotate .box { max-width:340px; }
  #rotate .ph { font-size:74px; display:inline-block; animation:tilt 1.6s ease-in-out infinite; }

var gameEl = null;
function resize() {
  if (!gameEl) { try { gameEl = document.getElementById('game'); } catch(e){} }
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  var vw = Math.floor(window.innerWidth), vh = Math.floor(window.innerHeight);
  var portrait = vh > vw;
  if (portrait) {
    // 논리 좌표계는 항상 가로: W=화면높이, H=화면너비
    ROT = 90; W = vh; H = vw;
    if (gameEl) {
      gameEl.style.width = vh + 'px';
      gameEl.style.height = vw + 'px';
      gameEl.style.left = '0px'; gameEl.style.top = '0px';
      gameEl.style.transformOrigin = '0 0';
      gameEl.style.transform = 'translateX(' + vw + 'px) rotate(90deg)';
    }
  } else {
    ROT = 0; W = vw; H = vh;
    if (gameEl) {
      gameEl.style.width = '100%';
      gameEl.style.height = '100%';
      gameEl.style.left = '0px'; gameEl.style.top = '0px';
      gameEl.style.transformOrigin = '';
      gameEl.style.transform = 'none';
    }
  }
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  buildStars();
}

var AudioEngine = {
  ctx:null, master:null, bus:null, drumBus:null, noise:null, ok:false, muted:false, unlocked:false, vol:1.0,
  init:function () {

      try { var comp=ac.createDynamicsCompressor(); comp.threshold.value=-10; comp.knee.value=24; comp.ratio.value=4; comp.attack.value=0.003; comp.release.value=0.2; this.master.connect(comp); comp.connect(ac.destination); }

  unlock:function () {

      g.gain.exponentialRampToValueAtTime(sus,t+atk+dec);
      g.gain.exponentialRampToValueAtTime(0.0001,endT);
      var parts=[[1,1.0,'triangle'],[2,0.34,'sine'],[3,0.14,'sine'],[4,0.06,'sine']];
      for (var i=0;i<parts.length;i++){ var o=ac.createOscillator(); o.type=parts[i][2]; o.frequency.value=f*parts[i][0]; var pg=ac.createGain(); pg.gain.value=parts[i][1]; o.connect(pg); pg.connect(g); o.start(t); o.stop(endT+0.08); }

/* ===================== 곡 데이터 (전부 퍼블릭 도메인, 직접 입력) ===================== */
function seq(bpm, notes) {
  var spb = 60/bpm, t=0, out=[];
  for (var i=0;i<notes.length;i++){
    var m=notes[i][0], b=notes[i][1], d=b*spb;
    if (m>0) out.push({midi:m, t:t, dur:Math.min(d*0.92, d), beats:b});
    t += d;
  }
  return {events:out, length:t, spb:spb, bpm:bpm};
}
function rep(a,n){ var o=[]; for(var i=0;i<n;i++){ for(var j=0;j<a.length;j++) o.push(a[j]); } return o; }

function T(arr,semi){ var o=[]; for(var i=0;i<arr.length;i++){ var m=arr[i][0]; o.push([m>0?m+semi:0, arr[i][1]]); } return o; }
function cat(){ var o=[]; for(var i=0;i<arguments.length;i++){ o=o.concat(arguments[i]); } return o; }

var GAME = {
  scene:'title', song:null, diff:null, demo:false,
  tiles:[], particles:[], songStartT:0, spawnIdx:0, scheduleIdx:0,
  score:0, combo:0, maxCombo:0, cntPerfect:0, cntGood:0, cntMiss:0, total:0,

/* v8: 곡별 박자(3/4 등) + 반주(베이스/드럼) 사전 계산 */
var METER = { danube:3, birthday:3 };
function precompAccompaniment(){
  var data=GAME.song.data, ev=data.events, spb=data.spb;
  GAME.meter = METER[GAME.song.id] || 4;
  GAME.totalBeats = Math.ceil(data.length/spb) + 1;
  GAME.beatMidi = [];
  var idx=0;
  for (var b=0;b<GAME.totalBeats;b++){
    var bt=b*spb;
    while (idx<ev.length && ev[idx].t <= bt+1e-6) idx++;
    GAME.beatMidi.push(idx>0 ? ev[idx-1].midi : (ev.length?ev[0].midi:60));
  }
}
function bassAt(bi){ var a=GAME.beatMidi; if(!a||!a.length) return 36; return a[Math.min(bi,a.length-1)]-24; }
/* 한 박자에 대한 드럼/베이스/코드 스케줄 (장르/박자별 패턴) */
function scheduleBeat(bi, at, spb, meter, genre){
  var A=AudioEngine, m=bi%meter, soft=(genre==='lullaby'), dv=soft?0.5:1.0;
  if (meter===3){
    if (m===0){ A.kick(at,0.9*dv); A.bass(bassAt(bi),at,spb*1.2,0.5*dv); A.chord(bassAt(bi)+24,at,spb*2.6,soft?0.07:0.1); }
    else { A.snare(at,0.4*dv); }
    A.hat(at,(m===0?0.24:0.18)*dv);
  } else {
    if (m===0||m===2){ A.kick(at,0.9*dv); A.bass(bassAt(bi),at,spb*1.05,0.5*dv); if(m===0) A.chord(bassAt(bi)+24,at,spb*3.0,soft?0.07:0.1); }
    if (m===1||m===3){ A.snare(at,0.45*dv); }
    A.hat(at,0.2*dv);
    if (!soft) A.hat(at+spb*0.5,0.13*dv);
  }
}

function midiToLane(midi, minM, maxM, lanes) {
  if (maxM<=minM) return Math.floor(lanes/2);
  var r = (midi - minM)/(maxM - minM);
  return clamp(Math.round(r*(lanes-1)), 0, lanes-1);
}
function buildTiles() {
  var ev = GAME.song.data.events;
  var lanes = GAME.diff.lanes;
  var minM=Infinity, maxM=-Infinity;
  for (var i=0;i<ev.length;i++){ if(ev[i].midi<minM)minM=ev[i].midi; if(ev[i].midi>maxM)maxM=ev[i].midi; }
  var dens = GAME.diff.density;
  GAME.tileEvents = [];
  for (var j=0;j<ev.length;j++){
    var e=ev[j], keep=true;
    if (dens==='sparse') keep=(j%2===0);
    else if (dens==='half') keep=(j%3!==2);
    else if (dens==='most') keep=(j%5!==4);
    if (!keep) continue;
    GAME.tileEvents.push({ t:e.t, midi:e.midi, dur:e.dur, lane:midiToLane(e.midi,minM,maxM,lanes), hit:false, judged:false });
  }
}

function startGame(song, diff, demo) {
  GAME.song=song; GAME.diff=diff; GAME.demo=!!demo;
  GAME.tiles=[]; GAME.particles=[]; GAME.flash=[]; GAME.hitText=[];
  GAME.score=0; GAME.combo=0; GAME.maxCombo=0;
  GAME.cntPerfect=0; GAME.cntGood=0; GAME.cntMiss=0;
  GAME.spawnIdx=0; GAME.scheduleIdx=0; GAME.ended=false; GAME.endTimer=0;
  GAME.cat.mood='idle'; GAME.cat.dizzy=0; GAME.cat.beat=0; GAME.cat.moodT=0;
  buildTiles();
  GAME.total = GAME.tileEvents.length;
  precompAccompaniment();
  GAME.beatIdx=0; GAME.shake=0; GAME.redFlash=0;
  AudioEngine.unlock();
  var lead = GAME.diff.lead;
  GAME.songStartT = gnow() + Math.max(lead,1.0) + 0.3;  // 오디오와 무관
  GAME.scene='game';
}
function endGame() { GAME.ended=true; GAME.scene='result'; }
function starRating() {
  var acc=accuracy();
  if (GAME.demo) return 3;
  if (acc>=0.9) return 3;
  if (acc>=0.7) return 2;
  if (acc>=0.4) return 1;
  return 0;
}
function accuracy() {
  var j=GAME.cntPerfect+GAME.cntGood+GAME.cntMiss;
  if (j===0) return 0;
  return (GAME.cntPerfect+GAME.cntGood*0.5)/j;
}

function pressLane(lane) {
  if (GAME.scene!=='game' || GAME.demo) return;
  var now=gnow(), best=null, bestDt=1e9;
  for (var i=0;i<GAME.tiles.length;i++){
    var tl=GAME.tiles[i];
    if (tl.lane!==lane || tl.judged) continue;
    var dt=Math.abs(now - tl.absHit);
    if (dt<bestDt){ bestDt=dt; best=tl; }
  }
  var d=GAME.diff;
  if (best && bestDt<=d.good) {
    best.judged=true; best.hit=true;
    if (bestDt<=d.perfect) registerHit('perfect', best); else registerHit('good', best);
  } else { laneFlash(lane,'#ffffff',0.25); }
}
function registerHit(kind, tile) {
  laneFlash(tile.lane, kind==='perfect'?'#fff2a8':'#bfe9ff', 0.6);
  spawnBurst(tile.lane, kind==='perfect');
  AudioEngine.hit(kind==='perfect');
  if (kind==='perfect'){ GAME.cntPerfect++; GAME.score+=100; } else { GAME.cntGood++; GAME.score+=60; }
  GAME.combo++; if (GAME.combo>GAME.maxCombo) GAME.maxCombo=GAME.combo;
  GAME.score += Math.min(GAME.combo,50);
  pushHitText(kind==='perfect'?'PERFECT!':'GOOD', tile.lane, kind==='perfect'?'#ffe06a':'#8fd7ff');
  catMood(GAME.combo>=8?'super':'happy');
}
function registerMiss(tile) {
  GAME.cntMiss++; GAME.combo=0;
  laneFlash(tile.lane,'#ff5a7a',0.5);
  AudioEngine.miss(); GAME.shake=0.3; GAME.redFlash=0.4;
  pushHitText('MISS', tile.lane, '#ff7a95');
  catMood('trip');
}
function catMood(m){ GAME.cat.mood=m; GAME.cat.moodT=0; if(m==='trip') GAME.cat.dizzy=1.0; }

function laneFlash(lane,color,life){ GAME.flash.push({lane:lane,color:color,life:life,max:life}); }
function pushHitText(txt,lane,color){ GAME.hitText.push({txt:txt,x:laneCenterX(lane),y:KB.judgeY-40,color:color,life:0.7}); }
function spawnBurst(lane, big){
  var x=laneCenterX(lane), y=KB.judgeY;
  var boost=Math.min(1+GAME.combo/22, 2.3);
  var n=Math.round((big?16:9)*boost);
  if (GAME.particles.length>220) n=Math.min(n,5);
  var col=NEON[lane % NEON.length];
  for (var i=0;i<n;i++){
    var a=rnd(0,Math.PI*2), sp=rnd(90,(big?380:240)*boost);
    GAME.particles.push({ x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(40,140),
      life:rnd(0.4,0.85),max:0.85,size:rnd(3,(big?8:6)),
      color:(Math.random()<0.55?col:'#ffffff') });
  }
}
function laneCount(){ return GAME.diff ? GAME.diff.lanes : 7; }
function laneW(){ return W / laneCount(); }
function laneCenterX(lane){ return laneW()*(lane+0.5); }
function topPlayY(){ return H*0.13; }

/* ===================== 루프 ===================== */
var lastTime = 0;
function tick(ms) {
  requestAnimationFrame(tick);
  try {
    var t=ms/1000, dt=lastTime?(t-lastTime):0; lastTime=t;
    dt=clamp(dt,0,0.05);
    mclock += dt;                 // 오디오 상태와 무관하게 항상 흐름
    if (GAME.scene==='game') updateGame(dt);
    updateParticles(dt);
    render(dt);
  } catch(e){}
}
function updateGame(dt) {
  var now=gnow(), song=GAME.song.data, lead=GAME.diff.lead;
  var pxPerSec=(KB.judgeY - topPlayY())/lead;
  var lookahead=0.35;
  try {
    while (GAME.scheduleIdx < song.events.length) {
      var ev=song.events[GAME.scheduleIdx];
      var at=GAME.songStartT+ev.t;
      if (at > now+lookahead) break;
      AudioEngine.note(ev.midi, AudioEngine.now()+Math.max(0, at-now), ev.dur, 0.62);
      GAME.scheduleIdx++;
    }
  } catch(e){ GAME.scheduleIdx = song.events.length; }
  try {
    var spb=song.spb, meter=GAME.meter||4;
    while (GAME.beatIdx < GAME.totalBeats) {
      var bt=GAME.songStartT + GAME.beatIdx*spb;
      if (bt > now+lookahead) break;
      scheduleBeat(GAME.beatIdx, AudioEngine.now()+Math.max(0, bt-now), spb, meter, GAME.song.genre);
      GAME.beatIdx++;
    }
  } catch(e){ GAME.beatIdx = GAME.totalBeats; }
  while (GAME.spawnIdx < GAME.tileEvents.length) {
    var te=GAME.tileEvents[GAME.spawnIdx];
    var hitAt=GAME.songStartT+te.t;
    if (hitAt-now > lead+0.05) break;
    GAME.tiles.push({ lane:te.lane, absHit:hitAt, midi:te.midi, judged:false, hit:false, missed:false,
      h:Math.max(38, Math.min(90, te.dur*pxPerSec*0.5+40)) });
    GAME.spawnIdx++;
  }
  var judgeY=KB.judgeY;
  for (var i=0;i<GAME.tiles.length;i++){
    var tl=GAME.tiles[i];
    tl.y=judgeY-(tl.absHit-now)*pxPerSec;
    if (GAME.demo && !tl.judged && now>=tl.absHit){
      tl.judged=true; tl.hit=true;
      laneFlash(tl.lane,'#fff2a8',0.6); spawnBurst(tl.lane,true); AudioEngine.hit(true);
      GAME.cntPerfect++; GAME.score+=100; GAME.combo++;
      if(GAME.combo>GAME.maxCombo)GAME.maxCombo=GAME.combo;
      pushHitText('PERFECT!',tl.lane,'#ffe06a'); catMood(GAME.combo>=8?'super':'happy');
    }
    if (!GAME.demo && !tl.judged && now > tl.absHit+GAME.diff.good){ tl.judged=true; tl.missed=true; registerMiss(tl); }
  }
  GAME.tiles=GAME.tiles.filter(function(tl){ return tl.y<H+60 && (!tl.judged || (now-tl.absHit)<0.35); });
  updateCat(dt, now);
  if (GAME.spawnIdx>=GAME.tileEvents.length && GAME.scheduleIdx>=song.events.length && GAME.tiles.length===0){
    GAME.endTimer+=dt; if (GAME.endTimer>1.1) endGame();
  }
  for (var f=GAME.flash.length-1;f>=0;f--){ GAME.flash[f].life-=dt; if(GAME.flash[f].life<=0)GAME.flash.splice(f,1); }
  for (var h=GAME.hitText.length-1;h>=0;h--){ GAME.hitText[h].life-=dt; GAME.hitText[h].y-=dt*40; if(GAME.hitText[h].life<=0)GAME.hitText.splice(h,1); }
}
function updateCat(dt, now) {
  var c=GAME.cat; c.moodT+=dt;
  c.beat = GAME.song ? ((now-GAME.songStartT)/GAME.song.data.spb) : 0;
  if (c.dizzy>0) c.dizzy=Math.max(0,c.dizzy-dt*1.1);
  if ((c.mood==='happy'||c.mood==='super') && c.moodT>0.5) c.mood='dance';
  if (c.mood==='trip' && c.moodT>0.9) c.mood='dance';
  if (c.mood==='idle') c.mood='dance';
}
function updateParticles(dt) {
  for (var i=GAME.particles.length-1;i>=0;i--){
    var p=GAME.particles[i]; p.life-=dt;
    if(p.life<=0){ GAME.particles.splice(i,1); continue; }
    p.vy+=380*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  if (GAME.particles.length>200) GAME.particles.splice(0, GAME.particles.length-200);
}

/* ===================== 배경 별 ===================== */
var stars=[];
function buildStars(){
  stars=[];
  var n=Math.min(Math.floor(W*H/14000),90);
  for (var i=0;i<n;i++) stars.push({x:rnd(0,W),y:rnd(0,H*0.7),r:rnd(0.6,2.0),p:rnd(0,6.28)});
}
/* ===== 비주얼 시스템 (v4) — 색/폰트/헬퍼 ===== */
var FONT='"Apple SD Gothic Neo","Segoe UI Rounded","Segoe UI",system-ui,-apple-system,sans-serif';
var UI={ ink:'#ffffff', ink2:'#e4dcff', ink3:'#b3a3e6',
  gold:'#ffd36b', goldInk:'#6b4300', grape:'#b49bff', grapeInk:'#241356',
  card:'rgba(255,255,255,0.10)', cardBd:'rgba(255,255,255,0.18)',
  panel:'rgba(28,18,58,0.55)', shadow:'rgba(20,10,45,0.32)' };
var LANE_COLORS=['#ff90a9','#ffb673','#ffe08a','#a7e88c','#7fd6ff','#9db4ff','#c79bff','#ff9ed6','#7fe6cf','#ffc59b'];
var NEON=['#ff3d7f','#ff8f3d','#ffe23d','#4dff88','#3dd7ff','#6a7bff','#b45bff','#ff5bc0','#3dffcf','#ff6b5b'];
var SONG_ACCENTS=['#ffd36b','#7fd6ff','#a7e88c','#ff9ed6','#ff90a9','#c79bff','#8fd0ff','#7fe6cf','#ffb673','#ffe08a','#ff9ed6','#a7e88c'];
var DIFF_COLORS=['#8fe39a','#7fc8ff','#ffb35c','#ff7d9e'];
var pressFx={tag:null,t:-9};
function softRect(x,y,w,h,r,fill){ ctx.save(); ctx.fillStyle=UI.shadow; rr(x,y+4,w,h,r); ctx.fill(); ctx.restore(); ctx.fillStyle=fill; rr(x,y,w,h,r); ctx.fill(); }

function render(dt){
  var sh=GAME.shake||0, ox=0, oy=0;
  if (sh>0){ ox=(Math.random()*2-1)*sh*14; oy=(Math.random()*2-1)*sh*10; GAME.shake=Math.max(0, sh-dt*1.8); }
  ctx.save();
  if (ox||oy) ctx.translate(ox,oy);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#141026'); g.addColorStop(0.5,'#0a0818'); g.addColorStop(1,'#070510');
  ctx.fillStyle=g; ctx.fillRect(-24,-24,W+48,H+48);
  ctx.save();
  var b1=ctx.createRadialGradient(W*0.2,H*0.1,0,W*0.2,H*0.1,W*0.5);
  b1.addColorStop(0,'rgba(120,60,200,0.16)'); b1.addColorStop(1,'rgba(120,60,200,0)');
  ctx.fillStyle=b1; ctx.fillRect(-24,-24,W+48,H+48);
  var b2=ctx.createRadialGradient(W*0.85,H*0.14,0,W*0.85,H*0.14,W*0.5);
  b2.addColorStop(0,'rgba(40,150,230,0.14)'); b2.addColorStop(1,'rgba(40,150,230,0)');
  ctx.fillStyle=b2; ctx.fillRect(-24,-24,W+48,H+48);
  ctx.restore();
  var tt=lastTime;
  ctx.save();
  for (var i=0;i<stars.length;i++){
    var s=stars[i], tw=0.5+0.5*Math.sin(tt*2+s.p);
    ctx.globalAlpha=0.12+0.4*tw; ctx.fillStyle='#cfe0ff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
  }
  ctx.restore();
  if (GAME.scene==='title') renderTitle();
  else if (GAME.scene==='select') renderSelect();
  else if (GAME.scene==='game') renderGame(dt);
  else if (GAME.scene==='result') renderResult();
  ctx.restore();
  if (GAME.redFlash>0){ ctx.save(); ctx.globalAlpha=Math.min(GAME.redFlash,1)*0.4; ctx.fillStyle='#ff2b52'; ctx.fillRect(0,0,W,H); ctx.restore(); GAME.redFlash=Math.max(0,GAME.redFlash-dt*2.4); }
  drawVersion();
}
var VERSION='v8';
function drawVersion(){
  try { ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle=UI.ink3;
    ctx.font='700 12px '+FONT; ctx.textAlign='left'; ctx.textBaseline='bottom';
    ctx.fillText(VERSION, 10, H-8); ctx.restore(); } catch(e){}
}

/* ===================== UI 버튼 ===================== */
var uiButtons=[];
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function button(x,y,w,h,label,tag,data,fill,textcol,fs){
  var r=Math.min(h/2,22);
  var pressed=(tag===pressFx.tag) && (lastTime-pressFx.t<0.13);
  var oy=pressed?2:0;
  ctx.save(); ctx.fillStyle=UI.shadow; rr(x,y+5-oy,w,h,r); ctx.fill(); ctx.restore();
  ctx.fillStyle=fill; rr(x,y+oy,w,h,r); ctx.fill();
  ctx.save(); ctx.globalAlpha=pressed?0.06:0.18; ctx.fillStyle='#ffffff'; rr(x+4,y+oy+3,w-8,h*0.44,r*0.7); ctx.fill(); ctx.restore();
  if(pressed){ ctx.save(); ctx.globalAlpha=0.08; ctx.fillStyle='#000'; rr(x,y+oy,w,h,r); ctx.fill(); ctx.restore(); }
  ctx.fillStyle=textcol||UI.grapeInk;
  ctx.font='800 '+(fs||Math.round(h*0.4))+'px '+FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(label,x+w/2,y+oy+h/2+1);
  uiButtons.push({x:x,y:y,w:w,h:h,tag:tag,data:data});
}

function renderGame(dt){
  uiButtons=[];
  var lc=laneCount(), lw=laneW(), topY=topPlayY(), hy=KB.judgeY, now=gnow();
  var spb=GAME.song.data.spb, beat=(now-GAME.songStartT)/spb, bp=beat-Math.floor(beat);
  var pulse=Math.max(0,1-bp*3.2);
  for (var l=0;l<lc;l++){ ctx.save(); ctx.globalAlpha=0.06; ctx.fillStyle=NEON[l%NEON.length]; ctx.fillRect(l*lw, topY, lw, H-topY); ctx.restore(); }
  ctx.save(); ctx.lineWidth=1; ctx.strokeStyle='rgba(255,255,255,0.06)';
  for (var i=1;i<lc;i++){ ctx.beginPath(); ctx.moveTo(i*lw,topY); ctx.lineTo(i*lw,H); ctx.stroke(); }
  ctx.restore();
  ctx.save(); var hg=ctx.createLinearGradient(0,hy,0,H); hg.addColorStop(0,'rgba(120,180,255,0.10)'); hg.addColorStop(1,'rgba(120,180,255,0)'); ctx.fillStyle=hg; ctx.fillRect(0,hy,W,H-hy); ctx.restore();
  for (var f=0;f<GAME.flash.length;f++){
    var fl=GAME.flash[f], a=fl.life/fl.max;
    ctx.save(); ctx.globalAlpha=a*0.85;
    var grd=ctx.createLinearGradient(0,hy-160,0,hy); grd.addColorStop(0,'rgba(255,255,255,0)'); grd.addColorStop(1,fl.color);
    ctx.fillStyle=grd; ctx.fillRect(fl.lane*lw, hy-160, lw, 160); ctx.restore();
  }
  for (var t=0;t<GAME.tiles.length;t++){
    var tl=GAME.tiles[t];
    if (tl.judged && tl.hit){ var af=clamp(1-(now-tl.absHit)/0.28,0,1); ctx.globalAlpha=af; }
    else if (tl.judged && tl.missed){ ctx.globalAlpha=0.28; }
    else ctx.globalAlpha=1;
    drawTile(tl, lw); ctx.globalAlpha=1;
  }
  ctx.save(); ctx.strokeStyle='rgba(235,245,255,'+(0.55+0.35*pulse)+')'; ctx.lineWidth=3+2.5*pulse; ctx.lineCap='round';
  ctx.shadowColor='rgba(150,210,255,0.85)'; ctx.shadowBlur=12+14*pulse;
  ctx.beginPath(); ctx.moveTo(8,hy); ctx.lineTo(W-8,hy); ctx.stroke(); ctx.restore();
  for (var l2=0;l2<lc;l2++){
    var col=NEON[l2%NEON.length], cxp=laneCenterX(l2), fa=keyPressAnim[l2]||0;
    var pw=lw*0.6, ph=Math.min(H*0.028,15);
    ctx.save(); ctx.globalAlpha=0.45+0.55*fa; ctx.shadowColor=col; ctx.shadowBlur=10+22*fa; ctx.fillStyle=col;
    rr(cxp-pw/2, hy-ph/2, pw, ph, ph/2); ctx.fill(); ctx.restore();
    keyPressAnim[l2]=Math.max(0,(keyPressAnim[l2]||0)-dt*3);
  }
  drawParticles();
  for (var h=0;h<GAME.hitText.length;h++){
    var ht=GAME.hitText[h], hpv=clamp(ht.life/0.7,0,1);
    ctx.save(); ctx.globalAlpha=hpv; ctx.shadowColor=ht.color; ctx.shadowBlur=10;
    ctx.fillStyle=ht.color; ctx.font='900 '+Math.round(Math.min(W*0.032,24)*(0.85+0.2*hpv))+'px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(ht.txt, ht.x, ht.y); ctx.restore();
  }
  ctx.textBaseline='middle';
  var scoreTxt='점수 '+GAME.score;
  ctx.font='800 '+Math.round(Math.min(W*0.03,22))+'px '+FONT;
  var spw=ctx.measureText(scoreTxt).width+26, sph=Math.round(Math.min(H*0.07,40));
  ctx.fillStyle='rgba(10,8,24,0.6)'; rr(12,10,spw,sph,sph/2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText(scoreTxt, 24, 10+sph/2+1);
  ctx.fillStyle=UI.ink3; ctx.font='600 '+Math.round(Math.min(W*0.02,14))+'px '+FONT; ctx.textBaseline='alphabetic';
  ctx.fillText(GENRE_LABEL[GAME.song.genre]+' · '+GAME.song.title, 16, 10+sph+16);
  ctx.textBaseline='middle';
  if (GAME.combo>=2){
    var cbt=GAME.combo+' COMBO', cs=Math.min(1+GAME.combo/60,1.4);
    ctx.font='900 '+Math.round(Math.min(W*0.034,26)*cs)+'px '+FONT;
    var cpw=ctx.measureText(cbt).width+30, cph=Math.round(Math.min(H*0.08,44));
    ctx.save(); ctx.shadowColor='rgba(255,220,120,0.6)'; ctx.shadowBlur=8*cs;
    ctx.fillStyle='rgba(255,211,107,0.14)'; rr(W/2-cpw/2,8,cpw,cph,cph/2); ctx.fill();
    ctx.fillStyle='#ffe27a'; ctx.textAlign='center'; ctx.fillText(cbt, W/2, 8+cph/2+1); ctx.restore();
  }
  var judged=GAME.cntPerfect+GAME.cntGood+GAME.cntMiss, prog=GAME.total?Math.round(judged/GAME.total*100):0;
  var eb=Math.min(W*0.09,52), rx=W-eb*2-28;
  ctx.textAlign='right'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#fff'; ctx.font='800 '+Math.round(Math.min(W*0.024,17))+'px '+FONT; ctx.fillText('진행 '+prog+'%', rx, 24);
  ctx.fillStyle=UI.ink3; ctx.font='600 '+Math.round(Math.min(W*0.02,14))+'px '+FONT; ctx.fillText('정확도 '+Math.round(accuracy()*100)+'%', rx, 44);
  if (GAME.demo){ ctx.textAlign='center'; ctx.fillStyle='#b48bff'; ctx.font='800 '+Math.round(Math.min(W*0.024,16))+'px '+FONT; ctx.fillText('👀 데모', W/2, 8+Math.min(H*0.08,44)+18); }
  button(W-eb-10-eb-8, 8, eb, eb, '⏹', 'quit_game', null, 'rgba(255,255,255,0.14)', '#fff', Math.round(eb*0.42));
  drawMuteButton();
}
function drawTile(tl, lw){
  var x=tl.lane*lw+3, w=lw-6, h=tl.h||46, y=tl.y-h;
  var col=NEON[tl.lane % NEON.length];
  var g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0, col); g.addColorStop(1, shade(col,0.62));
  ctx.save(); ctx.shadowColor=col; ctx.shadowBlur=16;
  ctx.fillStyle=g; rr(x,y,w,h,12); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.4)'; rr(x+5,y+4,w-10,h*0.28,6); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.5; rr(x,y,w,h,12); ctx.stroke();
}
function shade(hex,f){
  var c=hex.replace('#',''); if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r=Math.min(255,Math.round(parseInt(c.substr(0,2),16)*f));
  var g=Math.min(255,Math.round(parseInt(c.substr(2,2),16)*f));
  var b=Math.min(255,Math.round(parseInt(c.substr(4,2),16)*f));
  return 'rgb('+r+','+g+','+b+')';
}
var keyPressAnim=[];
function drawKeyboard(){
  var lc=laneCount(), lw=laneW(), top=KB.top, h=KB.height;
  ctx.fillStyle='rgba(255,255,255,0.10)'; ctx.fillRect(0, top-3, W, 3);
  for (var l=0;l<lc;l++){
    var x=l*lw, pressed=(keyPressAnim[l]||0)>0;
    var col=LANE_COLORS[l % LANE_COLORS.length];
    ctx.fillStyle=pressed?shade(col,1.15):'#fdfaff';
    rr(x+2, top, lw-4, h, 12); ctx.fill();
    ctx.fillStyle=col; rr(x+2, top+h*0.6, lw-4, h*0.4, 12); ctx.fill();
    ctx.fillStyle=pressed?shade(col,1.15):'#fdfaff'; ctx.fillRect(x+2, top+h*0.6, lw-4, 6);
    if(pressed){ ctx.save(); ctx.globalAlpha=0.2; ctx.fillStyle=col; rr(x+2,top,lw-4,h,12); ctx.fill(); ctx.restore(); }
    ctx.strokeStyle='rgba(80,50,120,0.16)'; ctx.lineWidth=1.5; rr(x+2,top,lw-4,h,12); ctx.stroke();
    keyPressAnim[l]=Math.max(0,(keyPressAnim[l]||0)-0.05);
  }
  if (lc>=4){
    var bw=Math.min(lw*0.4, 44), bh=h*0.5;
    for (var b=0;b<lc-1;b++){
      if (b%7===2 || b%7===6) continue;
      var bx=(b+1)*lw - bw/2;
      ctx.save(); ctx.shadowColor='rgba(0,0,0,0.25)'; ctx.shadowBlur=4; ctx.shadowOffsetY=2;
      ctx.fillStyle='#3a2a5c'; rr(bx, top, bw, bh, 6); ctx.fill(); ctx.restore();
      ctx.fillStyle='rgba(255,255,255,0.12)'; rr(bx+3,top+3,bw-6,bh*0.3,4); ctx.fill();
    }
  }
}

/* ===================== 고양이 한 마리 ===================== */
function drawCat(cx, cy, s, o){
  var mood=o.mood||'dance';
  var isTrip = (mood==='trip') || ((o.dizzy||0)>0.3);
  var fur=o.fur||'#f7b267', belly=o.belly||'#ffe0c0', earIn='#ff9ecb';
  var innerSide=o.innerSide||1;
  var aInner=clamp(o.aInner==null?0.2:o.aInner,0,1);
  var aOuter=clamp(o.aOuter==null?0.2:o.aOuter,0,1);
  var rightRaise = innerSide>0 ? aInner : aOuter;
  var leftRaise  = innerSide>0 ? aOuter : aInner;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(o.tilt||0);

  // 꼬리
  ctx.strokeStyle=shade(fur,0.9); ctx.lineWidth=s*0.2; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(s*0.55, s*0.55);
  ctx.quadraticCurveTo(s*1.15, s*0.2+Math.sin((o.beat||0)*1.5)*s*0.25, s*0.95, -s*0.35); ctx.stroke();

  // 팔(앞발)
  drawArm(-1, leftRaise, fur, s);
  drawArm( 1, rightRaise, fur, s);

  // 몸통 / 배
  ctx.fillStyle=fur; ctx.beginPath(); ctx.ellipse(0, s*0.55, s*0.6, s*0.55, 0,0,6.28); ctx.fill();
  ctx.fillStyle=belly; ctx.beginPath(); ctx.ellipse(0, s*0.62, s*0.33, s*0.35, 0,0,6.28); ctx.fill();

  // 발
  ctx.fillStyle=fur;
  ctx.beginPath(); ctx.ellipse(-s*0.26, s*1.0, s*0.15, s*0.11, 0,0,6.28); ctx.fill();
  ctx.beginPath(); ctx.ellipse( s*0.26, s*1.0, s*0.15, s*0.11, 0,0,6.28); ctx.fill();

  // 머리
  var hy=-s*0.15;
  ctx.fillStyle=fur;
  ctx.beginPath(); ctx.moveTo(-s*0.55,hy-s*0.35); ctx.lineTo(-s*0.22,hy-s*0.75); ctx.lineTo(-s*0.12,hy-s*0.3); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo( s*0.55,hy-s*0.35); ctx.lineTo( s*0.22,hy-s*0.75); ctx.lineTo( s*0.12,hy-s*0.3); ctx.closePath(); ctx.fill();
  ctx.fillStyle=earIn;
  ctx.beginPath(); ctx.moveTo(-s*0.42,hy-s*0.38); ctx.lineTo(-s*0.26,hy-s*0.6); ctx.lineTo(-s*0.2,hy-s*0.36); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo( s*0.42,hy-s*0.38); ctx.lineTo( s*0.26,hy-s*0.6); ctx.lineTo( s*0.2,hy-s*0.36); ctx.closePath(); ctx.fill();
  ctx.fillStyle=shade(fur,1.08); ctx.beginPath(); ctx.arc(0, hy, s*0.58, 0, 6.28); ctx.fill();

  // 리본(파트너 구분)
  if (o.ribbon){
    var rc=o.ribbonColor||'#ff7aa2';
    ctx.fillStyle=rc;
    var rx=-s*0.32, ry=hy-s*0.5;
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx-s*0.16,ry-s*0.1); ctx.lineTo(rx-s*0.16,ry+s*0.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(rx,ry); ctx.lineTo(rx+s*0.16,ry-s*0.1); ctx.lineTo(rx+s*0.16,ry+s*0.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.arc(rx,ry,s*0.05,0,6.28); ctx.fill();
  }

  // 얼굴
  ctx.fillStyle='#2a1e40';
  if (isTrip){
    ctx.lineWidth=s*0.06; ctx.strokeStyle='#2a1e40';
    drawX(-s*0.22, hy-s*0.02, s*0.12); drawX( s*0.22, hy-s*0.02, s*0.12);
    ctx.fillStyle='#fff'; ctx.font='700 '+(s*0.5)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('?', s*0.72, hy-s*0.7);
  } else {
    var eyeH=(mood==='super')?s*0.16:s*0.13;
    ctx.beginPath(); ctx.ellipse(-s*0.22, hy, s*0.09, eyeH, 0,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse( s*0.22, hy, s*0.09, eyeH, 0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-s*0.19, hy-s*0.04, s*0.03,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.25, hy-s*0.04, s*0.03,0,6.28); ctx.fill();
  }
  ctx.fillStyle='#ff7aa2';
  ctx.beginPath(); ctx.moveTo(0,hy+s*0.12); ctx.lineTo(-s*0.06,hy+s*0.05); ctx.lineTo(s*0.06,hy+s*0.05); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#a05a2c'; ctx.lineWidth=s*0.03; ctx.lineCap='round'; ctx.beginPath();
  if (mood==='super'||mood==='happy'){ ctx.arc(-s*0.06, hy+s*0.16, s*0.09, 0, Math.PI); ctx.arc(s*0.06, hy+s*0.16, s*0.09, 0, Math.PI); }
  else if (isTrip){ ctx.arc(0, hy+s*0.28, s*0.1, Math.PI, 0); }
  else { ctx.moveTo(-s*0.08,hy+s*0.2); ctx.quadraticCurveTo(0,hy+s*0.26,s*0.08,hy+s*0.2); }
  ctx.stroke();
  if (!isTrip){
    ctx.fillStyle='rgba(255,150,180,0.5)';
    ctx.beginPath(); ctx.arc(-s*0.4, hy+s*0.12, s*0.1,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.4, hy+s*0.12, s*0.1,0,6.28); ctx.fill();
  }
  ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.lineWidth=s*0.015;
  for (var w=0;w<2;w++){
    var yy=hy+s*0.08+w*s*0.1;
    ctx.beginPath(); ctx.moveTo(-s*0.3,yy); ctx.lineTo(-s*0.6,yy-s*0.04); ctx.stroke();
    ctx.beginPath(); ctx.moveTo( s*0.3,yy); ctx.lineTo( s*0.6,yy-s*0.04); ctx.stroke();
  }
  if (mood==='super' && !isTrip){
    ctx.fillStyle='#ffe06a'; ctx.font='700 '+(s*0.38)+'px sans-serif';
    ctx.fillText('♪', -s*0.8, hy-s*0.45);
  }
  ctx.restore();
}
function drawArm(sideX, raise, fur, s){
  var shx=sideX*s*0.48, shy=s*0.32;
  var reach=s*0.5;
  var px=shx + sideX*reach*(0.15+0.5*(1-raise));
  var py=shy + reach*(1-raise)*0.75 - reach*raise*0.85;
  ctx.strokeStyle=fur; ctx.lineWidth=s*0.15; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(shx,shy); ctx.lineTo(px,py); ctx.stroke();
  ctx.fillStyle=shade(fur,1.05); ctx.beginPath(); ctx.arc(px,py,s*0.1,0,6.28); ctx.fill();
}
function drawX(x,y,r){ ctx.beginPath(); ctx.moveTo(x-r,y-r); ctx.lineTo(x+r,y+r); ctx.moveTo(x+r,y-r); ctx.lineTo(x-r,y+r); ctx.stroke(); }

/* ===================== 파트너 댄스(장르별) ===================== */
function computeDance(genre, beat, mood, dizzy, s){
  var dance = danceForGenre(genre);
  var amp = mood==='super'?1.35:(mood==='happy'?1.15:1);
  var sep = s*0.95;
  var A={dx:-sep,dy:0,tilt:0,aInner:0.25,aOuter:0.2,innerSide:1};
  var B={dx: sep,dy:0,tilt:0,aInner:0.25,aOuter:0.2,innerSide:-1};
  var ph=beat*Math.PI;
  if(dance==='waltz'){
    var ang=beat/3*Math.PI*2;
    A.dx=(-sep)*Math.cos(ang); A.dy=(-sep)*Math.sin(ang)*0.35 - s*0.05;
    B.dx=( sep)*Math.cos(ang); B.dy=( sep)*Math.sin(ang)*0.35 - s*0.05;
    A.tilt=Math.sin(ang)*0.12; B.tilt=Math.sin(ang)*0.12;
    A.aInner=A.aOuter=0.8; B.aInner=B.aOuter=0.8;
  } else if(dance==='sway'){
    var sw=Math.sin(ph)*s*0.22*amp;
    A.dx=-sep+sw; B.dx=sep+sw;
    A.tilt=Math.sin(ph)*0.1; B.tilt=Math.sin(ph)*0.1;
    A.dy=-Math.abs(Math.sin(ph))*s*0.05; B.dy=A.dy;
    A.aInner=0.7; B.aInner=0.7; A.aOuter=0.15; B.aOuter=0.15;
  } else if(dance==='skip'){
    A.dy=-Math.abs(Math.sin(ph))*s*0.3*amp;
    B.dy=-Math.abs(Math.sin(ph+Math.PI))*s*0.3*amp;
    A.tilt=Math.sin(ph)*0.08; B.tilt=-Math.sin(ph)*0.08;
    A.aInner=0.5+0.4*Math.sin(ph); A.aOuter=0.5-0.4*Math.sin(ph);
    B.aInner=0.5+0.4*Math.sin(ph+Math.PI); B.aOuter=0.5-0.4*Math.sin(ph+Math.PI);
  } else if(dance==='bounce'){
    var hp=Math.abs(Math.sin(ph));
    A.dy=-hp*s*0.32*amp; B.dy=A.dy;
    A.dx=-sep*0.8; B.dx=sep*0.8;
    var clap=Math.max(0,Math.sin(ph));
    A.aInner=0.5+0.5*clap; A.aOuter=0.5+0.5*clap; B.aInner=A.aInner; B.aOuter=A.aOuter;
  } else { // swing
    var sg=Math.sin(ph);
    A.dx=-sep+sg*s*0.12; B.dx=sep+sg*s*0.12;
    A.tilt=sg*0.16; B.tilt=-sg*0.16;
    A.dy=-Math.abs(Math.sin(ph*2))*s*0.04; B.dy=A.dy;
    A.aInner=0.35+0.2*sg; A.aOuter=0.35-0.2*sg; B.aInner=0.35-0.2*sg; B.aOuter=0.35+0.2*sg;
  }
  if(dizzy>0.1){
    var w=Math.min(dizzy,1), wob=Math.sin(beat*40);
    A.dx=lerp(A.dx, -s*0.28, w); B.dx=lerp(B.dx, s*0.28, w);
    A.dy=lerp(A.dy, s*0.06, w); B.dy=lerp(B.dy, s*0.06, w);
    A.tilt=lerp(A.tilt, 0.5+wob*0.25, w); B.tilt=lerp(B.tilt, -0.5-wob*0.25, w);
    A.aInner=lerp(A.aInner,0.1,w); A.aOuter=lerp(A.aOuter,0.1,w);
    B.aInner=lerp(B.aInner,0.1,w); B.aOuter=lerp(B.aOuter,0.1,w);
    A.trip=w>0.35; B.trip=w>0.35;
  }
  return {A:A,B:B,dance:dance};
}
function drawDancers(cx, cy, s, genre, mood, beat, dizzy){
  var d=computeDance(genre, beat||0, mood, dizzy||0, s);
  var mA = d.A.trip?'trip':mood, mB = d.B.trip?'trip':mood;
  drawCat(cx+d.A.dx, cy+d.A.dy, s, {fur:'#f7b267',belly:'#ffe0c0',tilt:d.A.tilt,mood:mA,aInner:d.A.aInner,aOuter:d.A.aOuter,innerSide:d.A.innerSide,ribbon:false,dizzy:dizzy,beat:beat});
  drawCat(cx+d.B.dx, cy+d.B.dy, s, {fur:'#f39a68',belly:'#ffe6d2',tilt:d.B.tilt,mood:mB,aInner:d.B.aInner,aOuter:d.B.aOuter,innerSide:d.B.innerSide,ribbon:true,ribbonColor:'#ff5c9a',dizzy:dizzy,beat:beat});
}

function drawParticles(){
  for (var i=0;i<GAME.particles.length;i++){
    var p=GAME.particles[i], a=clamp(p.life/p.max,0,1);
    ctx.globalAlpha=a; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,6.28); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function renderResult(){
  uiButtons=[];
  var cx=W/2, stars3=starRating();
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.save(); ctx.shadowColor='rgba(255,150,210,0.5)'; ctx.shadowBlur=16;
  ctx.fillStyle=UI.gold; ctx.font='900 '+Math.round(Math.min(W*0.058,42))+'px '+FONT;
  ctx.fillText(stars3>=3?'참 잘했어요! 🎉':(stars3>=1?'잘했어요! 😺':'다시 도전! 🐾'), cx, H*0.15); ctx.restore();
  var sy=H*0.31, sgap=Math.min(W*0.12,86), ssz=Math.min(W*0.058,46);
  for (var i=0;i<3;i++){
    var on=i<stars3, pop=on?(1+0.08*Math.sin(lastTime*4+i)):1;
    ctx.save(); ctx.globalAlpha=on?1:0.28; ctx.font=Math.round(ssz*2*pop)+'px '+FONT; ctx.textBaseline='middle';
    ctx.fillText(on?'⭐':'☆', cx+(i-1)*sgap, sy); ctx.restore();
  }
  /* v8: 춤추는 고양이 제거 */
  var pw=Math.min(W*0.62,580), ph=Math.min(H*0.16,96), px=cx-pw/2, py=H*0.6;
  softRect(px,py,pw,ph,18, UI.card);
  ctx.lineWidth=1.5; ctx.strokeStyle=UI.cardBd; rr(px,py,pw,ph,18); ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.fillStyle='#fff'; ctx.font='800 '+Math.round(Math.min(W*0.03,21))+'px '+FONT;
  ctx.fillText('점수 '+GAME.score+'   ·   최고콤보 '+GAME.maxCombo, cx, py+ph*0.42);
  ctx.fillStyle=UI.ink3; ctx.font='600 '+Math.round(Math.min(W*0.024,16))+'px '+FONT;
  ctx.fillText('Perfect '+GAME.cntPerfect+'  ·  Good '+GAME.cntGood+'  ·  Miss '+GAME.cntMiss+'  ·  정확도 '+Math.round(accuracy()*100)+'%', cx, py+ph*0.72);
  var bw=Math.min(W*0.3,230), bh=Math.min(H*0.11,56), gap=Math.min(W*0.03,20);
  button(cx-bw-gap/2, H*0.82, bw, bh, '↻ 다시', 'retry', null, UI.gold, UI.goldInk);
  button(cx+gap/2, H*0.82, bw, bh, '🎵 곡 선택', 'to_select', null, UI.grape, '#ffffff');
  drawMuteButton();
}
function drawMuteButton(){
  var s=Math.min(W*0.09,52), x=W-s-10, y=8;
  ctx.save(); ctx.fillStyle=UI.shadow; rr(x,y+4,s,s,15); ctx.fill(); ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.16)'; rr(x,y,s,s,15); ctx.fill();
  ctx.strokeStyle=UI.cardBd; ctx.lineWidth=1.5; rr(x,y,s,s,15); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=Math.round(s*0.46)+'px '+FONT;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(AudioEngine.muted?'🔇':'🔊', x+s/2, y+s/2+1);
  uiButtons.push({x:x,y:y,w:s,h:s,tag:'mute'});
}

/* ===================== 입력 ===================== */
function mapClient(cx, cy){
  // 회전 상태에서 화면(viewport) 좌표 -> 게임(가로) 좌표로 역변환
  if (ROT===90){ return { x: cy, y: Math.floor(window.innerWidth) - cx }; }
  return { x: cx, y: cy };
}
function pointFromEvent(e){
  var cxp=(e.touches&&e.touches[0])?e.touches[0].clientX:e.clientX;
  var cyp=(e.touches&&e.touches[0])?e.touches[0].clientY:e.clientY;
  return mapClient(cxp, cyp);
}
function hitUI(px,py){
  for (var i=uiButtons.length-1;i>=0;i--){
    var b=uiButtons[i];
    if (px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h) return b;
  }
  return null;
}
function handleDown(px,py){
  AudioEngine.unlock();
  var b=hitUI(px,py);
  if (b){ doButton(b); return; }
  if (GAME.scene==='game' && py>=topPlayY()){
    var lane=clamp(Math.floor(px/laneW()),0,laneCount()-1);
    keyPressAnim[lane]=1; pressLane(lane);
  }
}
function doButton(b){
  pressFx.tag=b.tag; pressFx.t=lastTime;
  switch(b.tag){
    case 'go_select': selDemo=false; GAME.scene='select'; break;
    case 'demo_select': selDemo=true; GAME.scene='select'; break;
    case 'to_title': GAME.scene='title'; break;
    case 'pick_song': GAME.song=b.data; break;
    case 'pick_diff': GAME.diff=b.data; break;
    case 'start_play': if (GAME.song && GAME.diff) startGame(GAME.song, GAME.diff, selDemo); break;
    case 'quit_game': GAME.scene='select'; break;
    case 'retry': startGame(GAME.song, GAME.diff, GAME.demo); break;
    case 'to_select': selDemo=false; GAME.scene='select'; break;
    case 'mute': AudioEngine.setMuted(!AudioEngine.muted); break;
  }
}
function handleTouchStart(e){
  e.preventDefault(); AudioEngine.unlock();
  for (var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i]; var p=mapClient(t.clientX, t.clientY);
    handleDown(p.x, p.y);
  }
}
canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
canvas.addEventListener('mousedown', function(e){ var p=pointFromEvent(e); handleDown(p.x,p.y); });
document.addEventListener('touchmove', function(e){ if(e.target===canvas) e.preventDefault(); }, {passive:false});
var keyMap={a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7,l:8,';':9};
document.addEventListener('keydown', function(e){
  AudioEngine.unlock();
  var k=e.key.toLowerCase();
  if (k in keyMap && GAME.scene==='game'){ var lane=keyMap[k]; if(lane<laneCount()){ keyPressAnim[lane]=1; pressLane(lane); } }
});
try { console.info('piano rhythm game v8 (lane redesign, neon, rich audio; audio-decoupled)'); } catch(e){}
try { resize(); } catch(e){}
requestAnimationFrame(tick);
window.addEventListener('touchend', function(){ AudioEngine.unlock(); });
window.addEventListener('click', function(){ AudioEngine.unlock(); });
window.__PIANO__ = { GAME:GAME, SONGS:SONGS, DIFFS:DIFFS, AudioEngine:AudioEngine, startGame:startGame, buildTiles:buildTiles, danceForGenre:danceForGenre, computeDance:computeDance, GENRE_DANCE:GENRE_DANCE, mapClient:mapClient, _resize:resize, getROT:function(){return ROT;}, keyPressAnim:function(){return keyPressAnim;} };
})();
</script>
