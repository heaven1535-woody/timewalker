<!DOCTYPE html>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>냥냥 피아노 타일 🐱🎹</title>
<style>
  :root { color-scheme: light only; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html, body {
    width:100%; height:100%; overflow:hidden; position:fixed;
    background:#1a1030; touch-action:none; overscroll-behavior:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  #game { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #rotate {
    position:fixed; inset:0; z-index:9999; display:none;
    background:linear-gradient(160deg,#241246,#3a1d6e);
    color:#fff; align-items:center; justify-content:center; text-align:center;
    padding:calc(24px + env(safe-area-inset-top)) 24px;
  }
  #rotate .box { max-width:340px; }
  #rotate .ph { font-size:74px; display:inline-block; animation:tilt 1.6s ease-in-out infinite; }
  #rotate h2 { font-size:24px; margin:18px 0 8px; }
  #rotate p { font-size:16px; opacity:.85; line-height:1.5; }
  @keyframes tilt { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(82deg)} }
  @media (orientation:portrait) and (max-width:900px) {
    #rotate { display:flex; }
    #game { display:none; }
  }
</style>

var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = Math.floor(window.innerWidth);
  H = Math.floor(window.innerHeight);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
  buildStars();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });

function layout() {
  var kbH = Math.max(110, Math.min(H * 0.30, 200));
  KB.top = H - kbH;
  KB.height = kbH;
  KB.judgeY = KB.top - 6;
}
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function rnd(a,b){ return a+Math.random()*(b-a); }

var AudioEngine = {
  ctx:null, master:null, ok:false, muted:false,
  init:function () {
    if (this.ctx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.ok=false; return; }
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.ok = true;
    } catch(e){ this.ok=false; }
  },
  unlock:function () {
    if (!this.ok) this.init();
    if (this.ok && this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch(e){} }
  },
  now:function(){ return this.ok ? this.ctx.currentTime : 0; },
  setMuted:function (m) {
    this.muted = m;
    if (this.ok) { try { this.master.gain.setTargetAtValue(m?0:0.9, this.ctx.currentTime, 0.02); } catch(e){} }
  },
  note:function (midi, time, dur, vol) {
    if (!this.ok || this.muted) return;
    try {
      var ac = this.ctx;
      var f = 440 * Math.pow(2, (midi-69)/12);
      var g = ac.createGain(); g.connect(this.master);
      var v = (vol==null?0.5:vol); var t = time;
      g.gain.setValueAtValue(0.0001, t);
      g.gain.exponentialRampToValueAtValue(v, t+0.008);
      g.gain.exponentialRampToValueAtValue(v*0.35, t+0.10);
      g.gain.exponentialRampToValueAtValue(0.0001, t+dur);
      var o1 = ac.createOscillator(); o1.type='triangle'; o1.frequency.value=f;
      var o2 = ac.createOscillator(); o2.type='sine'; o2.frequency.value=f*2;
      var g2 = ac.createGain(); g2.gain.value=0.28; g2.connect(g);
      o1.connect(g); o2.connect(g2);
      o1.start(t); o2.start(t); o1.stop(t+dur+0.05); o2.stop(t+dur+0.05);
    } catch(e){}
  },
  ding:function (hi) {
    if (!this.ok || this.muted) return;
    try {
      var ac=this.ctx, t=ac.currentTime;
      var g=ac.createGain(); g.connect(this.master);
      g.gain.setValueAtValue(0.0001,t);
      g.gain.exponentialRampToValueAtValue(0.32,t+0.005);
      g.gain.exponentialRampToValueAtValue(0.0001,t+0.18);
      var o=ac.createOscillator(); o.type='sine'; o.frequency.value=hi?1568:1046;
      o.connect(g); o.start(t); o.stop(t+0.2);
    } catch(e){}
  },
  buzz:function () {
    if (!this.ok || this.muted) return;
    try {
      var ac=this.ctx, t=ac.currentTime;
      var g=ac.createGain(); g.connect(this.master);
      g.gain.setValueAtValue(0.0001,t);
      g.gain.exponentialRampToValueAtValue(0.22,t+0.01);
      g.gain.exponentialRampToValueAtValue(0.0001,t+0.22);
      var o=ac.createOscillator(); o.type='sawtooth';
      o.frequency.setValueAtValue(300,t);
      o.frequency.exponentialRampToValueAtValue(120,t+0.2);
      o.connect(g); o.start(t); o.stop(t+0.24);
    } catch(e){}
  }
};

function seq(bpm, notes) {
  var spb = 60/bpm, t=0, out=[];
  for (var i=0;i<notes.length;i++){
    var m=notes[i][0], b=notes[i][1], d=b*spb;
    if (m>0) out.push({midi:m, t:t, dur:Math.min(d*0.92, d), beats:b});
    t += d;
  }
  return {events:out, length:t, spb:spb};
}

var DIFFS = [
  { id:'easy',   name:'쉬움',   color:'#7ee081', lanes:3, lead:2.3,  density:'sparse', perfect:0.16, good:0.34, star:'🌱' },
  { id:'normal', name:'보통',   color:'#7ec8ff', lanes:4, lead:1.9,  density:'half',   perfect:0.13, good:0.28, star:'🙂' },
  { id:'hard',   name:'어려움', color:'#ffb347', lanes:6, lead:1.55, density:'most',   perfect:0.10, good:0.22, star:'🔥' },
  { id:'expert', name:'전문가', color:'#ff6b8b', lanes:7, lead:1.25, density:'full',   perfect:0.075,good:0.17, star:'👑' }
];

var GAME = {
  scene:'title', song:null, diff:null, demo:false,
  tiles:[], particles:[], startTime:0, spawnIdx:0, scheduleIdx:0,
  score:0, combo:0, maxCombo:0, cntPerfect:0, cntGood:0, cntMiss:0, total:0,
  ended:false, endTimer:0, tileEvents:[],
  cat:{ mood:'idle', moodT:0, dancePhase:0, hop:0, tilt:0, dizzy:0 },
  flash:[], hitText:[]
};

function midiToLane(midi, minM, maxM, lanes) {
  if (maxM<=minM) return Math.floor(lanes/2);
  var r = (midi - minM)/(maxM - minM);
  return clamp(Math.round(r*(lanes-1)), 0, lanes-1);
}
function buildTiles() {
  var ev = GAME.song.data.events;
  var lanes = GAME.diff.lanes;
  var minM=Infinity, maxM=-Infinity;
  for (var i=0;i<ev.length;i++){ if(ev[i].midi<minM)minM=ev[i].midi; if(ev[i].midi>maxM)maxM=ev[i].midi; }
  var dens = GAME.diff.density;
  GAME.tileEvents = [];
  for (var j=0;j<ev.length;j++){
    var e=ev[j], keep=true;
    if (dens==='sparse') keep=(j%2===0);
    else if (dens==='half') keep=(j%3!==2);
    else if (dens==='most') keep=(j%5!==4);
    if (!keep) continue;
    GAME.tileEvents.push({ t:e.t, midi:e.midi, dur:e.dur, lane:midiToLane(e.midi,minM,maxM,lanes), hit:false, judged:false });
  }
}

function startGame(song, diff, demo) {
  GAME.song=song; GAME.diff=diff; GAME.demo=!!demo;
  GAME.tiles=[]; GAME.particles=[]; GAME.flash=[]; GAME.hitText=[];
  GAME.score=0; GAME.combo=0; GAME.maxCombo=0;
  GAME.cntPerfect=0; GAME.cntGood=0; GAME.cntMiss=0;
  GAME.spawnIdx=0; GAME.scheduleIdx=0; GAME.ended=false; GAME.endTimer=0;
  GAME.cat.mood='idle'; GAME.cat.dizzy=0; GAME.cat.tilt=0; GAME.cat.hop=0;
  buildTiles();
  GAME.total = GAME.tileEvents.length;
  AudioEngine.unlock();
  var lead = GAME.diff.lead;
  GAME.startTime = AudioEngine.now() + Math.max(lead,1.0) + 0.3;
  GAME.scene='game';
}
function endGame() { GAME.ended=true; GAME.scene='result'; }
function starRating() {
  var acc=accuracy();
  if (GAME.demo) return 3;
  if (acc>=0.9) return 3;
  if (acc>=0.7) return 2;
  if (acc>=0.4) return 1;
  return 0;
}
function accuracy() {
  var j=GAME.cntPerfect+GAME.cntGood+GAME.cntMiss;
  if (j===0) return 0;
  return (GAME.cntPerfect+GAME.cntGood*0.5)/j;
}

function pressLane(lane) {
  if (GAME.scene!=='game' || GAME.demo) return;
  var now=AudioEngine.now(), best=null, bestDt=1e9;
  for (var i=0;i<GAME.tiles.length;i++){
    var tl=GAME.tiles[i];
    if (tl.lane!==lane || tl.judged) continue;
    var dt=Math.abs(now - tl.absHit);
    if (dt<bestDt){ bestDt=dt; best=tl; }
  }
  var d=GAME.diff;
  if (best && bestDt<=d.good) {
    best.judged=true; best.hit=true;
    if (bestDt<=d.perfect) registerHit('perfect', best); else registerHit('good', best);
  } else { laneFlash(lane,'#ffffff',0.25); }
}
function registerHit(kind, tile) {
  laneFlash(tile.lane, kind==='perfect'?'#fff2a8':'#bfe9ff', 0.6);
  spawnBurst(tile.lane, kind==='perfect');
  AudioEngine.ding(kind==='perfect');
  if (kind==='perfect'){ GAME.cntPerfect++; GAME.score+=100; } else { GAME.cntGood++; GAME.score+=60; }
  GAME.combo++; if (GAME.combo>GAME.maxCombo) GAME.maxCombo=GAME.combo;
  GAME.score += Math.min(GAME.combo,50);
  pushHitText(kind==='perfect'?'PERFECT!':'GOOD', tile.lane, kind==='perfect'?'#ffe06a':'#8fd7ff');
  catMood(GAME.combo>=8?'super':'happy');
}
function registerMiss(tile) {
  GAME.cntMiss++; GAME.combo=0;
  laneFlash(tile.lane,'#ff5a7a',0.5);
  AudioEngine.buzz();
  pushHitText('MISS', tile.lane, '#ff7a95');
  catMood('trip');
}
function catMood(m){ GAME.cat.mood=m; GAME.cat.moodT=0; if(m==='trip') GAME.cat.dizzy=1.0; }

function laneFlash(lane,color,life){ GAME.flash.push({lane:lane,color:color,life:life,max:life}); }
function pushHitText(txt,lane,color){ GAME.hitText.push({txt:txt,x:laneCenterX(lane),y:KB.judgeY-40,color:color,life:0.7}); }
function spawnBurst(lane, big){
  var x=laneCenterX(lane), y=KB.judgeY, n=big?14:8;
  if (GAME.particles.length>160) n=Math.min(n,4);
  for (var i=0;i<n;i++){
    var a=rnd(0,Math.PI*2), sp=rnd(60,big?260:170);
    GAME.particles.push({ x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-rnd(20,90),
      life:rnd(0.4,0.8),max:0.8,size:rnd(3,big?7:5),
      color:['#ffd54a','#ff8fc7','#7ee0ff','#b6f56b','#fff'][(Math.random()*5)|0] });
  }
}
function laneCount(){ return GAME.diff ? GAME.diff.lanes : 7; }
function laneW(){ return W / laneCount(); }
function laneCenterX(lane){ return laneW()*(lane+0.5); }
function topPlayY(){ return H*0.30; }

var lastTime = 0;
function tick(ms) {
  requestAnimationFrame(tick);
  var t=ms/1000, dt=lastTime?(t-lastTime):0; lastTime=t;
  dt=clamp(dt,0,0.05);
  if (GAME.scene==='game') updateGame(dt);
  updateParticles(dt);
  render(dt);
}
function updateGame(dt) {
  var now=AudioEngine.now(), song=GAME.song.data, lead=GAME.diff.lead;
  var pxPerSec=(KB.judgeY - topPlayY())/lead;
  var lookahead=0.35;
  while (GAME.scheduleIdx < song.events.length) {
    var ev=song.events[GAME.scheduleIdx];
    var at=GAME.startTime+ev.t;
    if (at > now+lookahead) break;
    AudioEngine.note(ev.midi, Math.max(at,now), ev.dur, 0.5);
    GAME.scheduleIdx++;
  }
  while (GAME.spawnIdx < GAME.tileEvents.length) {
    var te=GAME.tileEvents[GAME.spawnIdx];
    var hitAt=GAME.startTime+te.t;
    if (hitAt-now > lead+0.05) break;
    GAME.tiles.push({ lane:te.lane, absHit:hitAt, midi:te.midi, judged:false, hit:false, missed:false,
      h:Math.max(38, Math.min(90, te.dur*pxPerSec*0.5+40)) });
    GAME.spawnIdx++;
  }
  var judgeY=KB.judgeY;
  for (var i=0;i<GAME.tiles.length;i++){
    var tl=GAME.tiles[i];
    tl.y=judgeY-(tl.absHit-now)*pxPerSec;
    if (GAME.demo && !tl.judged && now>=tl.absHit){
      tl.judged=true; tl.hit=true;
      laneFlash(tl.lane,'#fff2a8',0.6); spawnBurst(tl.lane,true); AudioEngine.ding(true);
      GAME.cntPerfect++; GAME.score+=100; GAME.combo++;
      if(GAME.combo>GAME.maxCombo)GAME.maxCombo=GAME.combo;
      pushHitText('PERFECT!',tl.lane,'#ffe06a'); catMood(GAME.combo>=8?'super':'happy');
    }
    if (!GAME.demo && !tl.judged && now > tl.absHit+GAME.diff.good){ tl.judged=true; tl.missed=true; registerMiss(tl); }
  }
  GAME.tiles=GAME.tiles.filter(function(tl){ return tl.y<H+60 && (!tl.judged || (now-tl.absHit)<0.35); });
  updateCat(dt, now);
  if (GAME.spawnIdx>=GAME.tileEvents.length && GAME.scheduleIdx>=song.events.length && GAME.tiles.length===0){
    GAME.endTimer+=dt; if (GAME.endTimer>1.1) endGame();
  }
  for (var f=GAME.flash.length-1;f>=0;f--){ GAME.flash[f].life-=dt; if(GAME.flash[f].life<=0)GAME.flash.splice(f,1); }
  for (var h=GAME.hitText.length-1;h>=0;h--){ GAME.hitText[h].life-=dt; GAME.hitText[h].y-=dt*40; if(GAME.hitText[h].life<=0)GAME.hitText.splice(h,1); }
}
function updateCat(dt, now) {
  var c=GAME.cat; c.moodT+=dt;
  var beat=GAME.song?((now-GAME.startTime)/GAME.song.data.spb):0;
  c.dancePhase=beat*Math.PI;
  if (c.dizzy>0) c.dizzy=Math.max(0,c.dizzy-dt*1.2);
  if ((c.mood==='happy'||c.mood==='super') && c.moodT>0.5) c.mood='dance';
  if (c.mood==='trip' && c.moodT>0.9) c.mood='dance';
  if (c.mood==='idle') c.mood='dance';
}
function updateParticles(dt) {
  for (var i=GAME.particles.length-1;i>=0;i--){
    var p=GAME.particles[i]; p.life-=dt;
    if(p.life<=0){ GAME.particles.splice(i,1); continue; }
    p.vy+=380*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  if (GAME.particles.length>200) GAME.particles.splice(0, GAME.particles.length-200);
}

var stars=[];
function buildStars(){
  stars=[];
  var n=Math.min(Math.floor(W*H/14000),90);
  for (var i=0;i<n;i++) stars.push({x:rnd(0,W),y:rnd(0,H*0.7),r:rnd(0.6,2.0),p:rnd(0,6.28)});
}
function render(dt){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1560'); g.addColorStop(0.55,'#3a1d6e'); g.addColorStop(1,'#1a1030');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  var tt=lastTime;
  ctx.save();
  for (var i=0;i<stars.length;i++){
    var s=stars[i], tw=0.5+0.5*Math.sin(tt*2+s.p);
    ctx.globalAlpha=0.3+0.6*tw; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,6.28); ctx.fill();
  }
  ctx.restore();
  if (GAME.scene==='title') renderTitle();
  else if (GAME.scene==='select') renderSelect();
  else if (GAME.scene==='game') renderGame(dt);
  else if (GAME.scene==='result') renderResult();
}

var uiButtons=[];
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();

function shade(hex,f){
  var c=hex.replace('#',''); if(c.length===3)c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
  var r=Math.min(255,Math.round(parseInt(c.substr(0,2),16)*f));
  var g=Math.min(255,Math.round(parseInt(c.substr(2,2),16)*f));
  var b=Math.min(255,Math.round(parseInt(c.substr(4,2),16)*f));
  return 'rgb('+r+','+g+','+b+')';
}

function drawCat(cx, cy, s, cat){

  ctx.fillStyle='#f7b267';

  ctx.fillStyle='#ff9ecb';

  ctx.beginPath(); ctx.moveTo( s*0.42,hy-s*0.38); ctx.lineTo( s*0.26,hy-s*0.6); ctx.lineTo( s*0.2,hy-s*0.36); ctx.closePath(); ctx.fill();

    ctx.fillStyle='#fff'; ctx.font='700 '+(s*0.5)+'px sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('?', s*0.75, hy-s*0.7);
  } else {
    var eyeH=(mood==='super')?s*0.16:s*0.13;
    ctx.beginPath(); ctx.ellipse(-s*0.22, hy, s*0.09, eyeH, 0,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.ellipse( s*0.22, hy, s*0.09, eyeH, 0,0,6.28); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-s*0.19, hy-s*0.04, s*0.03,0,6.28); ctx.fill();
    ctx.beginPath(); ctx.arc( s*0.25, hy-s*0.04, s*0.03,0,6.28); ctx.fill();
  }
  ctx.fillStyle='#ff7aa2';
  ctx.beginPath(); ctx.moveTo(0,hy+s*0.12); ctx.lineTo(-s*0.06,hy+s*0.05); ctx.lineTo(s*0.06,hy+s*0.05); ctx.closePath(); ctx.fill();

  ctx.stroke();

    case 'pick_song': GAME.song=b.data; break;
    case 'pick_diff': GAME.diff=b.data; break;
    case 'start_play': if (GAME.song && GAME.diff) startGame(GAME.song, GAME.diff, selDemo); break;
    case 'quit_game': GAME.scene='select'; break;
    case 'retry': startGame(GAME.song, GAME.diff, GAME.demo); break;

    var t=e.changedTouches[i];
    handleDown(t.clientX-r.left, t.clientY-r.top);

}

document.addEventListener('touchmove', function(e){ if(e.target===canvas) e.preventDefault(); }, {passive:false});
var keyMap={a:0,s:1,d:2,f:3,g:4,h:5,j:6,k:7};
document.addEventListener('keydown', function(e){
  AudioEngine.unlock();
  var k=e.key.toLowerCase();
  if (k in keyMap && GAME.scene==='game'){ var lane=keyMap[k]; if(lane<laneCount()){ keyPressAnim[lane]=1; pressLane(lane); } }
});
resize();
requestAnimationFrame(tick);
window.addEventListener('touchend', function(){ AudioEngine.unlock(); });
window.addEventListener('click', function(){ AudioEngine.unlock(); });
window.__PIANO__ = { GAME:GAME, SONGS:SONGS, DIFFS:DIFFS, AudioEngine:AudioEngine, startGame:startGame, buildTiles:buildTiles };
})();
</script>
</body>
